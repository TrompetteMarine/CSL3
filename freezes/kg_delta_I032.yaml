  - {from: DISS-H1b-TOST, to: DISS-MEAS-ATTENUATION, type: refuted_by, note: "power"}
  - {from: DISS-H1b-TOST, to: DISS-RIVAL-COMPOSITE, type: refuted_by, note: "specificity"}
  - {from: DISS-H1b-SIc, to: DISS-RIVAL-COMPOSITE, type: tested_by}
  - {from: DISS-DOSE-STEP, to: DISS-P3-SLOPE-DOSE, type: qualified_by,
     note: "the in-session separating signature is slope, not curvature (post-hoc)"}
  - {from: DISS-H1, to: DISS-S7-TOLERANCE, type: requires,
     note: "level depends on differential-suspicion load staying under tolerance"}
