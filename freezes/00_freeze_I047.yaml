addendum_AD1:
  seen_before_writing: "records/live_cert_I047.txt (the first run, kept as it came out). G18(a) passes. G18(b)
    FAILS at the frozen tolerance of .03: against the I043 record the q = 0 rows differ by up to .038
    (confirmatory pair, P4, kappa_s .2), .049 (FREEZE), .091 (association within HIGH) and .098 (D1 from the
    source pair alone). Inside the run the same cell (q = 0, P4, kappa_s .2, 72 pairs) reads .828 in section 1
    and .784 in section 3, which differ only in the forecasts drawn for the pool. The decision rule read on
    that run gives 'both' (largest fall .011, largest rise .064, largest size .0085)."
  diagnosis: "the +-.03 taken over from the I041 and I043 records understates the Monte Carlo error of rates
    away from 0 and 1. Each rate comes from one simulated pool of 20,000 pairs, and the pool's own draw moves
    it. The unchanged I043 script reproduces its record byte for byte here: the record is a correct single
    draw, and its stated precision is what is in question."
  what_is_added: "experiment/analysis/live_cert_ad_I047.py: eight independent pools per cell (seeds 141100 to
    141107), the same thirty cells and three values of q at 72 pairs, the both-LOW world, and the anchoring
    edge by number of pairs. For every rate: mean and standard deviation across the pools."
  G18b_replaced_by: "G18(b'): every value of the I043 record that is compared lies inside the range of the
    eight q = 0 pools widened by .02 on each side (2,000 samples at a rate of .5 carry a sampling error of
    .011)."
  decision_rule_restated: "the frozen rule read on the means over the eight pools: 'both' if at q = .5 and at
    q = 1 the mean confirmatory pair is no lower than at q = 0 by more than .03 in any of the thirty cells, and
    the mean sizes of H1a, D1 and BET in the two null worlds are at or below .010."
  expectations:
    E11: "the standard deviation across pools of the confirmatory pair at P4 under the one-update rule lies
      between .015 and .04; at cells at or above .99 it is below .005."
    E12: "the rule read on the means gives 'both'."
    E13: "FREEZE in the both-LOW world at q = 1 has a mean above .02: once everyone is on the better good the
      LOW board no longer leaves a homogeneous control arm, and its lowest-rated third revises visibly less."
