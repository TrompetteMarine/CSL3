# =================================================================== THE CLAIM THAT HAS TO BE TESTED BEFORE 'BOTH' CAN BE THE DEFAULT
why: "the ledger holds DISS-CHOICE-EFFECT (I040): ticket choice sets the model's levels, and a choice-free
  variant needs its own certification. Showing both goods' prices tells every participant after round 1 which
  good is cheaper. People who then order the cheaper good in every deprivation round are the choice-free case.
  Design B was certified with model-like choices (records/basket_cert_I043.txt)."
claims:
  C1:
    kind: statistical
    statement: "with a share q of participants who order the better good in every deprivation round (round 1
      chosen as before), q in {0, .5, 1}, the decision rates of the reporting set at 72 pairs are computed for
      the five gate points, both revision rules and kappa_s in {.5, .35, .2}, with the kernel, the ratings
      (gain .5, noise 5.8), the forecasts, the bets and the tests of basket_cert_I043.py."
    assumption_A_CF: "the display changes the kernel's inputs only through the good ordered: seeing the other
      good's price has no effect of its own on legitimacy or aspiration (no regret channel). A human quantity;
      the model has no term for it."
    assumption_A_Q: "informed participants order the better good from round 2 on; the others choose as the
      model does. Each member of a pair is informed independently with probability q."
    verifier: "simulation, experiment/analysis/live_cert_I047.py, seed 141000, 20,000 pairs per cell, 2,000
      samples; analysis/twins_I040.py gains an optional argument whose default reproduces the earlier records."
    acceptance: "G18"
    if_it_fails: "price_curves = 'own' is the default, 'both' stays an option, and the memo says at which
      points the two-curve display costs power."
decision_rule_for_the_default: "price_curves = 'both' becomes the default of the development and pilot
  configurations if, at q = .5 and at q = 1, the confirmatory pair at 72 pairs is no lower than at q = 0 by
  more than .03 in any of the thirty cells (five points, two rules, three kappa_s), and the sizes of H1a, D1
  and BET in the two null worlds of the I043 record stay at or below .010. Otherwise 'own'."

# =================================================================== DESIGN DECISIONS (taken before building)
design_decisions:
  D1: "one layout: a single column of at most 480 px, at every window width. Reference phones 390 x 844 and
    360 x 640. On a wider screen the column stands in the middle of the tinted ground."
  D2: "rounds 1 to 6 are one market screen in two states, on the two existing pages (Order, Clearing). Open:
    the chart frame with the cap, a row per good with a button, and, once a good is chosen, a ticket docked
    at the foot with the cap and the existing button 'Send the order'. Running: the same chart drawn in real
    time, the rows with the clearing prices, the ordered good marked, then the filled orders. The server's
    flow, forms and stored fields are those of 569c3f8."
  D3: "the chart: one line per good shown, in the good's colour; the head of each line is the good's shape;
    the ordered good's line lies on top and carries a dot at every filled order; the strip of ticks under the
    plot is the ordered good's. One cap line; the fixed logarithmic price axis of the session's file."
  D4: "a session key price_curves with the values 'both' and 'own'. The browser writes into settle_meta how
    many price lines it drew."
  D5: "before the order the chart frame shows the cap, the zone under it and its existing caption, and no
    price: a picture of the rule the order follows. No earlier round is shown again."
  D6: "the lower chart of the running screen gets the caption (answer 1)."
  D7: "bet page: three choices as now (YES, NO, pass) and the existing button. Each ticket shows one figure,
    its cost in points, inside the existing sentence 'costs N points'. Neutral cards. The settled markets'
    YES and NO tags are neutral too."
  D8: "colour tokens for YES and NO are removed from the stylesheet."
  D9: "touch: every control at least 44 x 44 px and the main button of a page at least 48 px high; no feature
    needs a pointer that hovers; after a round has cleared, a finger moved along the chart shows the clearing
    under it in a line above the chart; sliders follow I5 as amended."
  D10: "the main button of a page sits at the foot of the column; heights are set from the visible height of
    the window (dvh), so that the browser's bars do not push it out of view."
  D11: "the viewport and whether the whole running screen fitted it are written into settle_meta. No layout
    for a phone held sideways and no notice asking to turn it: that would be a new sentence."
  D12: "prediction-market pages (rounds 7 to 10): the same column; flow, order of appearance and durations
    unchanged."
  D13: "instructions: both legends stay (answer 5); headings above their text."
  D14: "type, neutrals and the goods' colours of I046 stay. Motion as in I046: nothing marks a fill, a miss, a
    basket or a bet with a flash or a burst."
not_in_scope:
  - "prices set by participants' orders (design W), an order placed or changed while a round runs, a time
    limit on ordering: each changes what a round is"
  - "the schedule format, the engine, the data model, the export, the bots, the payment parameters"
  - "a text alternative for the charts (answer 3); a layout for a phone held sideways; a rule on which devices
    are admitted"
  - "the earlier bandit app; the database structure the author named for a later step"

