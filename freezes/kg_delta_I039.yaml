# KG delta — KGi-DISS-I039 (on top of kg_delta_I032.yaml, kg_delta_I033_I034.yaml incl. its
# i035 and i036 blocks, kg_delta_I037.yaml and kg_delta_I038.yaml; scoped transaction;
# history kept; nothing overwritten)
version: 1
baseline_snapshot: "CSL3 main 0c5dcbd (I038 close); CSL lean-diss-core 4049e6a"
edge_convention: "requires: dependent -> prerequisite"

node_updates:
  - id: DISS-SUFF-MEAN-v2
    old_status: "supported-synthetic; read in I038 as 'the mean is the right functional'"
    new_status: "RE-SCOPED. It is an edge-location regularity on five shapes and nothing
      more. Mean sufficiency is FALSE: the I038 frozen test failed (differences up to .38 at
      equal means) and DISS-AGG-IDENTITY shows the aggregate response is not a function of
      the mean beyond one evidence step. The sufficiency reading and rule R1b are withdrawn."
  - id: DISS-ESTIMAND-PSI
    added_qualification: "psi is the first moment of the relative gain distribution. From T
      alone, with the depth of delegitimation not assumed known, the ratio of means is at the
      information bound for psi (RE .95-1.00 with both depth directions unknown; .62-.69
      under the count rule if only the uniform shift is unknown; .20-.85 if the gate point
      is assumed known). With the rating as a covariate the bound is 22-49% lower."
    evidence: "records/likelihood_I039.txt, records/likelihood_ad_I039.txt"
  - id: DISS-PSI-PRODUCT
    added_evidence: "now also a theorem (Lean T14) and a distribution-level fact: with a
      uniform shift of HIGH legitimacy unknown, T alone keeps 1-27% of the information for
      c; (F, T) keeps 91-96% under the one-update rule and 38-61% under the count rule"
  - id: DISS-PSI-DECISIONS
    added_evidence: "frontier for D1 (n per arm for .90): 8 / 16 at P1 / P4 with everything
      known; 16 / 36 with the baseline weight unknown (size-controlled likelihood ratio);
      model-free interval 24 / 60-72 (one-update rule)"
  - id: DISS-H1-STRUCTURE-V3
    added_proposal: "report the pooled T-F association together with psi < 1 (author
      decision): the conjunction is the first test that rejects the homogeneous-slowdown
      rival"

new_nodes:
  - id: DISS-FORMAL-AGG
    kind: formal
    status: certified (Lean 4.28.0 core, over Rat; independent compile; axiom audit clean)
    statement: "T6 freeze; T7 gain ratio; T8 aggregation identity; T9, T9b, T9c dispersion
      (strict witness); T10 two-step response; T11 horizon inequality for every t; T12
      two-type identification; T13 reference monotonicity; T14 product bound; T15 association"
    evidence: "CSL branch lean-diss-core 11f09cb: formal_diss/DissAggregation.lean,
      DissAggregationAudit.lean, verification_record_aggregation.json"
    scope: "algebra and order; two types where a population is involved; nothing stochastic"
  - id: DISS-REF-MONOTONE
    kind: theorem
    status: certified (Lean T13)
    statement: "for a given outcome sequence in {0,1}, a pointwise higher reference gives a
      pointwise higher aspiration and lower legitimacy, provided phi_plus <= tau"
    scope_condition_found: "phi_plus <= tau is necessary (counterexample in the audit file);
      frozen values .25 <= .3"
  - id: DISS-AGG-IDENTITY
    kind: theorem
    status: certified for two types (Lean T8, T9c, T11); general case analytic
    statement: "mean update = kappa (mean gain x mean error + Cov(gain, error)); the residual
      error after t events is mean((1 - w)^t) >= (1 - mean w)^t, with strict inequality for a
      proper mixture at t >= 2: the aggregate is not a function of the mean gain"
  - id: DISS-AGG-PATHS
    kind: model
    status: supported-synthetic
    statement: "residual error of the model's HIGH population at probe time after 20 events,
      population | mean-gain agent: P1 .786 | .322, P2 .703 | .236, P3 .783 | .309, P4 .409 |
      .010; limit = share with legitimacy 0 (.39 / .30 / .37 / .17)"
    evidence: "records/likelihood_I039.txt section 6"
  - id: DISS-MIN-SCENARIO
    kind: definition
    status: adopted (I039)
    statement: "Sigma = (arm, last fairness rating F, probe statistic T), all already
      recorded by design S1x. O1: psi < 1. O2: Cov(T, F | arm) > 0 wherever legitimacy
      varies (the negative of mean sufficiency). O3: no revision at the bottom of the
      fairness scale when c = 1."
  - id: DISS-LIK-ABM
    kind: method
    status: verified against the simulator (total variation .0024-.0026)
    statement: "likelihood of one participant = mixture, over the legitimacy distribution
      generated by ABM agents performing the task, of an exact probe kernel k(t | w) and a
      rating kernel h(f | l); scores by differences of exact tables"
    evidence: "experiment/analysis/likelihood_core_I039.py; records/likelihood_I039.txt"
  - id: DISS-FRONTIER-EST
    kind: statistical
    status: supported-synthetic (bounds inside the model family)
    statement: "information for c per participant pair at full coupling: 3.2 / 50.2 at P1
      (one-update / count rule), 1.5 / 19.2 at P4; ratings multiply it by 1.13-1.95. Bound on
      s.e.(c) at 72 per arm from (F, T): .06-.08 (one-update), .02 (count)."
    evidence: "records/likelihood_I039.txt section 3; records/likelihood_ad_I039.txt"
  - id: DISS-FRONTIER-TEST
    kind: statistical
    status: supported-synthetic
    statement: "n per arm for power .90, no coupling against full coupling: most powerful
      test 8 / 16 (P1 / P4, one-update), 4 / 12 (count); with ratings 6 / 10 and 4 / 6;
      profile-likelihood interval for psi covers .991-.996 with width .36-.84 of Fieller's"
    evidence: "records/frontier_I039.txt sections A, C; records/frontier_ad_I039.txt"
  - id: DISS-LR-SIZE
    kind: limitation
    status: established
    statement: "the likelihood-ratio test with the baseline weight profiled and a fixed
      critical value does not hold its size (up to .50 at 72 per arm when the true weight is
      .35). With the critical value taken as the worst case over weights .30-.70 it needs
      16 / 36 per arm. The model-free interval holds its size (.004-.006)."
    evidence: "records/frontier_I039.txt section B; records/frontier_ad_I039.txt"
  - id: DISS-STATE-DEP
    kind: statistical
    status: supported-synthetic
    statement: "pooled within-arm rank association of T and F at 72 per arm: power .64-.87 at
      P1-P3, 1.00 at P4, .20-.22 at P0. HIGH-only: .29-.41 (one-update) at P1-P3. The
      HIGH-minus-LOW contrast has no power because the association is in both arms.
      Conjunction with psi < 1: false positives .0000 (R3), .0035 (HS), .0018 (SH).
      Frontier for dependence in HIGH: 36-72 per arm; the rank test needs 200-300."
    evidence: "records/frontier_I039.txt sections D, E, F"
  - id: DISS-COMPLEMENT
    kind: model
    status: supported-synthetic (observation)
    statement: "psi and state dependence are complementary across the theory region: where
      everyone has collapsed (P0) psi is extreme and dependence is invisible; at the
      anchoring edge psi is weakest and dependence is strongest"
  - id: DISS-RIVAL-HS-SH
    kind: rival
    status: open
    statement: "a uniform slowdown in HIGH combined with a trait that links rating and
      weight passes the conjunction test; needs the equality of between-arm and within-arm
      slopes, corrected for rating noise"

