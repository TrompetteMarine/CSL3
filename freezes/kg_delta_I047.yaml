refuted_preserved:
  - "gate G18(b) as frozen (the q = 0 column agrees with records/basket_cert_I043.txt within .03): differences of up to .038 (confirmatory pair), .049 (FREEZE), .091 (association within HIGH) and .098 (D1 from the source pair alone); replaced by G18(b') in addendum AD1 before the replicate run"
  - "the precision of +-.03 stated for the rates of the I041 and I043 records and in YOKED_DESIGN.md: the standard deviation across independent pools is up to .04"
  - "the clause of gate G11 'a good's colour at full strength on white or its own tint only': under 'both' the other good's line crosses the ordered good's tint (Triangle 3.001:1)"
  - "E2 in part (the confirmatory pair stays at 1.000 at P0-P3 when all are informed): as low as .987"
  - "E3 in part (association within HIGH at P4 below .90; within .05 at P1-P3): below .90 under the one-update rule only; changes of up to .071"
  - "E4 in part (every rate at q = .5 between its values at q = 0 and q = 1): the top quarter at P4 is highest at q = .5 in all six cells, outside the range by up to .091"
  - "E6 in part (the rating page does not fit 375 x 667; the evidence page fits 390 x 844 only with a smaller chart): both fit, the first after tightening, the second with 148 px to spare"
  - "E7 (bundle 170-200 KB): 168,523 bytes"
  - "E8 in part (the longest frame is higher with two lines): not ordered by display"
  - "E11 in part (standard deviation across pools .015-.04 for the pair at P4): .005 / .006 / .017"
  - "the first full check passed every gate while a tag hid part of two axis figures on small phones and every page was a line higher than the window in production"
  - "my setting of 76 px for the market's small chart on short windows, made to let the evidence page fit: it put the tag over the axis figures"
  - "my fit gate asked whether a page's parts are in view and took that for 'no scrolling'; the page was 24 px higher than the window since I042"
  - "tools/layout_check.py as it stood compared pieces of text only; a figure under an opaque box passed"
  - "the first slider rule for a finger (a touch that ends without a scroll is a tap): a finger that wandered without the browser scrolling set the slider"
  - "tools/mark_contrast.py with a reach of 6 device pixels on 3x screenshots: a false finding of 2.75:1 on a hairline"
  - "the freeze's times, written without reading the clock; and its phrase 'the two null worlds of the I043 record', one of which is in the I041 record"
  - "my assumption while taking pictures that the second link of a session is the pair's LOW member: a participant takes the next free slot on leaving the quiz, so the first to arrive is on the HIGH board"

flags_not_patched: "none for the manuscript. For the experiment: 'live' was read as real time from the
  schedule and the author has not confirmed it (DISS-LIVE-READING); 'both' is the default and FREEZE is not
  valid under it; no person has seen the display; every check ran in Chromium, phones by emulation; the
  instructions do not say that both goods' prices are drawn; two existing sentences speak to a mouse or a
  laptop; the wording is still draft; the pilot is not specified."
integrity: {proof_cycle_check: pass, ids_unique: checked_against_prior_deltas,
  application_bridge: "the certification holds for simulated cohorts under the kernel, the assumed share of
    informed participants and the assumption that the display acts only through the good ordered; the
    interface gates were measured by playing whole sessions in a browser against development and production
    servers and by exporting bot sessions; whether people read the screen as intended is untested; nothing
    was run on people"}
persistence: "CSL3 freezes/kg_delta_I047.yaml + Project mirror; no remote KG service"
