part_3_scorecard:   # verbatim, 2026-11-11; record records/theorem_tests_I040.txt (seed 137100)
  E3_1_freeze: "FAIL on both bands, in the favourable direction. Decision at delta = .25, 72
    per arm, full coupling: .327 / .333 / .276 at P1 / P2 / P4 under the one-update rule
    (predicted <= .30); .841 / .805 / .654 under the count rule (predicted .30-.80 at P1).
    At 150 and 300 per arm, one-update rule: .60-.69 and .92-.96. At delta = .5: .90-.93
    (one-update) and 1.000 (count) at 72. False decisions at coupling .75: <= .003 (PASS).
    Uptake ratio in the stratum at full coupling: .012-.054."
  E3_2_contrast: "FAIL as stated: top third against bottom third gives .180 / .254 / .170 at
    P1-P3 (one-update), below the rank correlation (.286 / .399 / .290). The top quarter
    against the rest gives .407 / .532 / .418 (count rule .618 / .803 / .643). Size .004-.007."
  E3_3_two_types: "PASS at P0-P3 (returned coupling .995 / .968 / .957 / .969 at truth 1;
    .746 / .726 / .718 / .727 at truth .75). FAIL at P4 for truth .75 (.673, off by .077).
    The returned value is the truth times E[(1-l)^2] / E[1-l]."
  E3_4_two_step: "one-update rule: 3,368 per arm at P1 (PASS: above 1,000), 618 at P4. Count
    rule: 204 at P1, 97 at P4 (the 97 is below my 200-1,000). Monte Carlo power at the
    asymptotic n: .849, .813, .987 where .90 was targeted."
  E3_5_bound: "PASS. Smallest margin psi - (1 - c) is 0 (at c = 0) at every point, both rules."
AD_T2_scorecard:   # verbatim; record records/assumption_tests_I040.txt (seed 137200)
  A_K3: "PASS. Entitlement rating HIGH above LOW: .891-1.000 at 36 per arm, 1.000 at 72."
