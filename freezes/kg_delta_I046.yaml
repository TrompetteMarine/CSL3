  - {from: DISS-OTREE-MARKET, to: DISS-UI-GATES, type: tested_by, note: "G1: bot exports identical"}
  - {from: DISS-FRONTEND, to: DISS-DISPLAY-RISK, type: qualified_by}
  - {from: DISS-EFFECTIVE-DRAWS, to: DISS-DISPLAY-RISK, type: qualified_by}
  - {from: DISS-HUMAN-PARAMS, to: DISS-DISPLAY-RISK, type: qualified_by, note: "attention to the board; heaping of ratings at the slider's marks"}
