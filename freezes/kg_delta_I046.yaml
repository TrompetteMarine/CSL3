  - {from: DISS-WAVE1-CHECKS, to: DISS-DISPLAY-RISK, type: qualified_by, note: "the pilot reads the human quantities on the new display"}

refuted_preserved:
  - "E1 (G1, G4, G5, G6, G7, G9 pass at the first attempt): the first build crashed the order page (a display variable of mine had the name of one the page already used); all six passed from the second build on"
  - "E2 (baseline audit: no language and no title on every page, colour contrast on the bet page): colour contrast also on the order page; no title is not reported on the development server, which writes its own tab title, and is reported in production mode"
  - "E4 (the rating page needs scrolling at 1366 x 650): it fits, with 44 px to spare"
  - "E6 (with a four-fold slowdown the median frame is 17-34 ms): 16.7 ms; the slowdown did not move the median"
  - "E7 (the list of added text is empty or holds chart axis labels only): four words on the instructions page ('Square', 'Triangle', 'not', 'filled') and one axis label inside a chart"
  - "the first full check of the build passed every gate it measured while three clauses of G11 were unmeasured and violated: a price line at 2.1-2.7:1, Triangle's colour at 2.96:1 on two grounds, and a cross-fade of the top bar under reduced motion"
  - "the second full check passed every gate, the three added ones included, while the caption of the fill zone hid the dot of a filled order and the hover readout covered the point it described: both were my own changes, made to stop marks from cutting letters and to bring the readout to the pointer"
  - "my drawing of the zone's caption over the data on a halo (to keep its letters whole) traded a cosmetic flaw for a hidden data mark"
  - "decision D9 of the freeze (control states change in 120-240 ms): one took 280 ms, as since I043; now 220 ms"
  - "my runner printed FAIL on the baseline and on the first full check because its completeness check counted five participants and the keyboard session adds a sixth"
  - "in the first stacked layout of the clearing page the lower chart was flatter than the old one; the two charts were then given equal heights"
  - "one run of the browser test failed for a reason not found: its output was not kept and the machine was loaded by my own sessions; the same checks had passed on that build, and the test passed on the later builds, alone and under load"
  - "the browser test left its server's child process running after every run since I043; it now stops the whole process group"

flags_not_patched: "none for the manuscript. For the experiment: the display changed and no person has seen
  it (DISS-DISPLAY-RISK); every check ran in Chromium only, none on a real phone, in Firefox or in Safari, and
  none with a screen reader; the charts have no text alternative; the lower chart of the clearing page has no
  caption; the wording is untouched and still draft; the pilot is not specified."
integrity: {proof_cycle_check: pass, ids_unique: checked_against_prior_deltas,
  application_bridge: "the gates were measured by playing whole sessions in a browser against the running
    app and by exporting bot sessions; the baseline was measured with the same runner on the tree of c73284a;
    whether people read the pages as intended is untested; nothing was run on people"}
persistence: "CSL3 freezes/kg_delta_I046.yaml + Project mirror; no remote KG service"
