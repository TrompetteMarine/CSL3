package_A_prior_elicitation:
  deliverable: "experiment/PRIORS.md in the public repo (CSL3) + Project mirror"
  trio_frozen:  # confirmed by the author (these three were proposed and are now frozen)
    P-A: "reference-dependence magnitude (from confirmatory H1): HIGH-LOW difference
      in the P1->P2 legitimacy drop; the only confirmatory quantity; seeds the field
      prior on how much delegitimation is reference-driven rather than outcome-driven"
    P-B: "restoration dissociation + recovery threshold (from discriminating H2/H3):
      behaviour-vs-trust lag after restoration, and the FULL-vs-MODERATE reopening
      contrast; seeds the field priors on persistence half-life of delegitimated
      discourse after corrective exposure and on the minimum visible-success dosage"
    P-C: "aspiration-rigidity distribution (instrumental, from H4 + entitlement
      slider): individual rho posteriors (slider-identified, synthetic recovery
      r=.91); seeds the field heterogeneity prior and, through the t* clock, the
      predicted persistence distribution"
  honesty_constraints:
    - "only H1 is confirmatory (alpha=.005, N=320/cell, d=.25 design floor);
      P-B/P-C are preregistered secondaries/instruments, never promoted post hoc"
    - "all numeric priors below are MODEL-GENERATED at frozen defaults; the lab
      posteriors replace them; the chain model->lab->field is stated at every use"
    - "no individual-level nuR priors (group bias -30%, excluded at I003); dual-alpha
      asymmetry stays exploratory (OFF-level sanity failed at I015, shift-only claims)"
    - "window mapping: HIGH/LOW is a within-window displacement of x; the field stage
      estimates platform x distributions; t*(x) maps lab rho-hat to field persistence"

