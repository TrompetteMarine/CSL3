# =================================================================== WHAT IS COMPUTED
conventions:
  level: "one-sided .005 (the programme's level) for every decision; the first wave's checks also at .05"
  target: "power .90 (primary) and .80"
  required_n: "the smallest n of a fixed grid at which the estimated power reaches the target. Pairs: 12, 18,
    24, 30, 36, 48, 60, 72, 84, 96, 120, 144, 168, 192, 240, 288, 336, 384, 480, 576. Triplets: 3, 4, 5, 6, 8,
    10, 12, 16, 20, 24, 32. 'More than the grid' is a result."
  cohorts: "individual design: 20,000 simulated pairs per cell (twins_I040.twins, different people, own ticket
    noise); live economy: 3,000 simulated sessions per arm and cell; 2,000 samples per n; seed 141000"
  gate_points: "P0-P4 of I038 (P1 the paper's values, P4 the anchoring edge). 'Binding' = the largest
    requirement over P1-P4."
  people: "a pair is 2 participants; a triplet is 36 at six per market and 24 at four"
  worst_case: "where two estimates of one quantity differ, the larger requirement is adopted"

steps:
  wave_1_assumptions: "the built individual app (design B: procurement, then four prediction markets; no cash and
    no completion link). K3 entitlement HIGH above LOW (one item, noise 10, as built; three items, noise 5.8, as
    certified); H1a last fairness LOW above HIGH; PHI flag inside LOW when a win erodes fairness (phi_plus .5,
    1.0 against the frozen .25)."
  wave_1_people: "what the wave tells about people. (a) Settlements per round varied between participants (40
    against 120): does the control arm's last fairness rating differ, as it does if a round is integrated
    settlement by settlement? (b) Records of 4 against 10 closes within participant: does the revision weight
    rise with the length of the record (count rule) or not (one-update rule)? (c) Precision of the control
    arm's revision weight and of the spread of T, and of the main-study sample size computed from them."
  gate: "the confirmatory pair (H1a then D1) on the individual design: by gate point and revision rule; then one
    change at a time at the binding point: weight on a source .2 / .5; two record pairs; forecast noise 8 / 16;
    20% inattentive; a round counting for 80 or 40 settlements."
  rivals: "HIGH-arm association, top quarter against the rest, freeze at .5; the plateau statistic PLAT2 on
    twelve successive records, taken on individuals (each participant a unit), with its size against a
    uniformly slowed HIGH arm"
  economy:
    cash_link: "not simulated: T is taken from private forecasts before any trade, so the model predicts no
      change; the requirement is that of the rung it is added to"
    ownership: "not simulated: fills and prices are unchanged by construction"
    completion_gate_individual: "a basket of q fills per round (10, 15, 20; 30 are expected on the better
      ticket); bidding stops at completion; the prediction market is open to those who completed the last
      round's basket"
    live_market: "design W by triplets, calibrated supply, six and four per market; session effect 0, .1, .2
      shared within a session"
    live_stopping_basket: "the same with a basket of 15 or 10 units per round that ends a trader's bidding"
    institution: "unit orders against shares, each in its own triplets: is the fairness contrast larger and
      the uptake ratio lower under unit orders?"

# =================================================================== GATES
gates:
  G1_bridge_individual: "the new individual runner without a basket gives legitimacy at probe time within .01
    of twins_I040.twins at P1 and P4"
  G2_bridge_live: "the new live runner without a basket equals market_cert_I044.run bit for bit on the same
    seeds"
  G3_sizes: "every test behind a required n rejects a true null in at most .012 at nominal .005 and at most
    .07 at nominal .05, at the smallest n and at 72 pairs (6 triplets)"
  G4_determinism: "a second run is bit-identical"
  G5_constraints: "nothing run on people; app, wording and main text untouched; no credential anywhere"
  G6_formula: "the closed form n = 14.88 (s_H^2 + s_L^2) / (m_L - m_H)^2 agrees with the simulated requirement
    for D1 within one grid step at P1 and P4"

