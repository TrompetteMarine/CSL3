      x=0.1125); inside the band cascade multiplicity decides; I021 pooled
      x_B~0.11 = the singleton edge / upper envelope"
    - "TWO CLOCKS: t* = gate reopening (closed form, confirmed); t** = resolution
      (repair throttled by continuing failures while A decays; closed-form mean
