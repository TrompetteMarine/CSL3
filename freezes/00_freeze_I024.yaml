  central_refinements:
    - "two-level law quantified: conditional on n, x is a near-step (stratified
      table; AUC 0.917 x alone -> 0.962 x+log n -> 0.972 +geometry)"
    - "edge envelope: trap certain below x~0.075, escape certain above x~0.1125 in
