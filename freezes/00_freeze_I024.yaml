    (rhoT>=2.0 cells all still trapped) -> two-clock account frozen as addendum 1
    pre-run, AD1-AD3 ALL PASS, calibration t** ~ 1.4-1.5x t*; P8 FAIL at C cells
    (consequence of P7; split appears in addendum resolved cells, cred 0.92/0.85);
