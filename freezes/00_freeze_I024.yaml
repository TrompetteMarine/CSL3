  closed: "2026-11-05"
  gates: "mnet2 driver exact-reproduction gate PASSED (40/40 rows bit-identical to
    I021 cell 2); legacy five-gate validate unchanged"
  battery: "51 main cells (1,740 runs) + addendum 5 cells (120 runs); records
    mnet2_cells.csv, mnet2_comm.csv, mnet2ad_cells.csv, mnet2ad_comm.csv"
  scorecard: "P1 PASS (side-claim ws1-clustered mis-binned: fails as shielding cell,
    confirms invariance at drift 0.016); P2 PASS (broadcast M=1000 n=100 traps
    1.000 - 'corrects at scale' dead as an M-claim); P3 PASS; P4 PASS; P5 FAIL as
    frozen (edge one grid step lower: (0.075,0.100] at M=100 scattered); P6 FAIL
