rivals:
  excluded_by_design: ["R1-global (opposite sign)", "R3 aspiration-in-utility", "R3 slow-reporting variants", "R4 group-contingent", "R3+R4 composite", "R5 rule inference", "disengagement that differs by arm, in the supplementary analysis (trimming interval)", "static heterogeneity linking rating and weight, by psi < 1 (.0018)"]
  excluded_only_with_a_larger_sample: ["homogeneous slowdown of the HIGH arm (HamJenkins2025 class): rejected at size by the HIGH-arm association, whose power is .27-.40 at 72 pairs at P1-P3 and .76-.98 at 216-288 (DISS-ASSOC-BY-ARM); .90 needs 288 pairs with two record pairs and 480 with a source pair under the one-update rule, 192 and 240 under the count rule (I045); not at all at P0", "the same rival with twelve records on a claim (DISS-TEST-PLAT2): power .61 (one-update rule) and .96 (count rule) at P1 with 72 traders per arm in 12 markets; with each participant a unit .35 and .60 at 72 per arm, .90 from 288 and 168 per arm (I045); not at P0; not if disengagement differs by arm"]
  not_excluded: ["a uniform slowdown combined with a trait that links rating and weight inside HIGH (DISS-RIVAL-HS-SH, DISS-MEDIATION-LIMIT)", "disengagement that differs by arm, in the primary analysis"]

