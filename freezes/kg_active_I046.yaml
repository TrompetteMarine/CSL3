  - "effective draws per round summary (DISS-EFFECTIVE-DRAWS) - decides between 84 pairs and 288-336 at the anchoring edge; readable from the ratings of one cell of a first wave (DISS-ROUND-COUNT-READOUT: .95 correct from 36 pairs)"
  - "the size of the effect: every requirement of I045 is at the model's own effect at the anchoring edge (DISS-POWER-SCOPE)"
  - "control arm's absolute revision weight W0 and the revision rule - the frontier differs by a factor of 5-15 in information between the two rules; the rule is identified by a 4-against-10 record probe with 120 control participants, which the app does not have (DISS-TEST-REVISION-RULE); it moves the gate test from 84 to 60 pairs and the rival test from 288 to 192"
  - "forecast noise and its shape; fairness scale gain, noise and link"
  - "starting entitlement; rigidity distribution"
  - "differential disengagement; board believability"
  - "ticket choices: the share of yoked pairs that choose alike; whether a win can erode fairness (PHI)"
  - "the revision rule also sets the sample for the HIGH-arm association (288 pairs or 192 for .90, two record pairs)"
  - "how the display is integrated: reveal speed (9 s per round as built), device, clearings per round - candidate pilot factors; whether a price curve is read as a record of fills; the display itself was laid out anew in I046 (DISS-DISPLAY-RISK): attention to the board and heaping of ratings at the slider's marks are to be read in the pilot"
  - "kappa_s, the weight on a source's forecast (DISS-SOURCE-WEIGHT); how people bet at a posted price of 50 (DISS-TEST-BET)"
  - "for a live economy (DISS-DESIGN-W): the size of session effects; how people sort between the goods (it sets the rich neighbour's fill rate, the dose); whether they trade their forecasts against a market maker; how they bid if they set bids; how they would split a basket target; a session effect of .2 against none doubles the live rung (16 triplets against 8 at six per market)"

open_simulation:
  - "a state-dependence statistic near its frontier (collapsed stratum against the rest) and the slope-equality test against DISS-RIVAL-HS-SH"
  - "a covariate-adjusted estimator of psi using F, with robustness to the rating link"
  - "machine-check the two-type lower bound (T16) and a general monotone-kernel version of T13"
  - "the association by arm under rating shapes M2-M6 (I041 scored it with plain ratings only); slowdowns other than the mean-gain one"
  - "design W: a basket as a round target with a completion payment, under an assumed rule for how people split"
