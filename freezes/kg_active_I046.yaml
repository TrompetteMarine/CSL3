# Active claim ledger for the experiment after KGi-DISS-I046 (a retrieval aid, not a second
# source of truth: every line points to its node in the KG deltas and its record).
# Supersedes kg_active_I045.yaml. SUPERSEDED by kg_active_I047.yaml.
as_of: "2026-11-17, CSL3 main after the I046 close; CSL lean-diss-core 11f09cb"

formal_core:   # machine-checked (Lean 4.28.0 core, over Rat)
  - {node: DISS-FORMAL-AGG, value: "T6-T15: freeze, gain ratio, aggregation identity, dispersion, horizon inequality, two-type identification, reference monotonicity, product bound, association", record: "CSL formal_diss/DissAggregation.lean"}
  - {node: DISS-REF-MONOTONE, value: "a higher reference gives higher aspiration and lower legitimacy path by path, provided phi_plus <= tau"}
  - {node: DISS-AGG-IDENTITY, value: "the aggregate response is NOT a function of the mean gain beyond one evidence step"}

theory_region:   # where the paper's headline trap holds at its own cell
  - {node: DISS-TRAP-SPEED-EDGE, value: "gate speed >= .895", record: "records/invcal.csv"}
  - {node: DISS-DESIGN-BASIS-THEORY-EDGE, value: "repair/erosion ratio <= .292; anchoring weight >= .32-.36", record: "records/100_inverse_calibration_I032pc.md"}
  - {node: DISS-BGT-TIP, value: "conformity at the tipping gap (.200 = true payoff gap)", record: "records/bgt_I036.txt"}
  - {node: DISS-SUFF-MEAN-v2, value: "edge-location regularity only: the trap edge sits at a mean coupling of .90-.95 on five shapes; NOT mean sufficiency (trap probability differs by up to .38 at equal means)", record: "records/hetc.csv, hetc2.csv"}
  - {node: DISS-PREV-EDGE, value: "a shut-down majority is not enough: 80% fully shut with 20% open gives .04", record: "records/hetc.csv"}
  - {node: DISS-AGG-PATHS, value: "after 20 evidence events the model's HIGH population holds .79 of its error where a mean-gain agent holds .32 (P1); limit = share with legitimacy 0", record: "records/likelihood_I039.txt"}
  - {node: DISS-CORRECTION-TIME, value: "below the edge: graded lengthening of the wrong consensus", record: "records/ctime.csv"}

minimal_scenario:
  node: DISS-MIN-SCENARIO
  observables: "arm, last fairness rating F, probe statistic T (all already in design S1x)"
  implications: "O1 psi < 1; O2 T-F association within arm (the negative of mean sufficiency); O3 no revision at the bottom of the fairness scale at full coupling"

estimands:
  first_moment:
    node: DISS-ESTIMAND-PSI
    definition: "psi = E[T | HIGH] / E[T | LOW]; ratio of arm means with a 99% Fieller interval"
    model_values: {node: DISS-PSI-TRAPSET, value: "full coupling: .01 (P0), .13-.19 (P1-P3), .47-.51 (anchoring edge); trap set [.006, .613]; rivals 1.00 (R3, R4), 3.7-4.2 (R1)"}
    efficiency: {node: DISS-FRONTIER-EST, value: "at the information bound from T alone when the depth of delegitimation is not assumed known (RE .95-1.00); 22-49% below the bound once F is used as a covariate"}
    limit: {node: DISS-PSI-PRODUCT, value: "psi identifies coupling x achieved delegitimation; T alone keeps 1-27% of the information for c when HIGH legitimacy may be uniformly higher; (F, T) keeps 91-96% (one-update rule), 38-61% (count rule)"}
  state_dependence:
    node: DISS-STATE-DEP
    definition: "within-arm rank association of T and F, reported BY ARM (I041); the pooled form is kept in the records only"
    value: "HIGH arm (node DISS-ASSOC-BY-ARM): .27 / .40 / .37 at P1-P3 and 1.00 at the anchoring edge at 72 pairs (one-update rule), size-level at P0; .76 / .91 / .88 at 216 pairs, .89 / .98 / .96 at 288; count rule .83 / .96 / .87 at 144. LOW arm: .44 / .18 / .57. Sizes .003-.008."
    scope_of_the_pooled_form: "pooled power .64-.87 at P1-P3 and its false-positive figure for a homogeneous slowdown (.0035) hold only if LOW is ungated; with LOW gated the pooled conjunction passes that rival in .16 (72 pairs) to .65 (216) (node DISS-RIVAL-HS-G)"
  complementarity: {node: DISS-COMPLEMENT, value: "psi is strongest where state dependence is invisible (P0) and weakest where it is strongest (anchoring edge)"}

human_validation:   # I040: how each theorem is to be tested with people (synthetic power; nothing tested on people yet)
  ledger: {node: DISS-THEOREM-LEDGER, record: "records/109_theorem_tests_I040.md"}
  design_audit: {node: DISS-T13-DESIGN-AUDIT, value: "same outcomes: never unless draws are yoked (then 41-73% of pairs); references ordered at every settlement: 56% of pairs; legitimacy ordered at round ends: 99.6-99.7%"}
  conclusion_T13: "last fairness rating LOW above HIGH: power 1.00 from 18 per arm at P0-P3; .99 at 36 at the anchoring edge"
  assumptions:
    - {node: DISS-TEST-K3, value: "aspiration rises with the reference: entitlement rating, power .89-1.00 at 36 per arm; for .90 at one-sided .005: 24 pairs at P1-P3 and 48 at the anchoring edge with three items, 60 and 96 with the one item of the built app (I045)"}
    - {node: DISS-TEST-K2, value: "legitimacy falls with aspiration: NOT testable at 72 per arm (.07-.25)"}
    - {node: DISS-PHI-PLUS, value: "a win never erodes fairness: slope test false alarm .01, power .59 (phi_plus .5) / .97 (1.0); if violated LOW is not a clean control; flagged with .90 from 168 pairs (.5) and 60 (1.0); under the frozen model the flag fires in .008-.009 up to 288 pairs and .013 at 576 (I045)"}
  kernel_tests:
    - {node: DISS-TEST-FREEZE, value: "lowest-rating third of HIGH: uptake below .5 of normal with power .90-1.00 at 72 per arm; below .25 needs 300 (one-update rule); for .90: 72 pairs with two record pairs and 96 with a source pair (one-update rule), 30 and 60 (count rule) (I045)"}
    - {node: DISS-TWO-TYPE-BOUND, value: "two-type inversion = lower bound on the coupling, factor .90-.995 (analytic; Lean target)"}
  not_at_this_scale: {node: DISS-TWO-STEP, value: "two-record probe for the horizon theorems: 3,400 per arm at the paper's values under the one-update rule"}
  design_options: [{node: DISS-YOKE, value: "yoke draws across arms in pairs: harmless and free, but no power gain once people choose their own tickets (I041)"}, {node: DISS-CHOICE-EFFECT, value: "keep the ticket choice; a choice-free variant changes the levels and would need certification"}]

design_B:   # I043: design Y in the storyboard's institutions; certified for what it changes; built; NOT run on people
  design: {node: DISS-DESIGN-B, record: "records/112_basket_market_I043.md; experiment/YOKED_DESIGN.md", value: "rounds 1-6: order a good, the goods market clears 120 times, the order fills when the clearing price is at or below the cap; rounds 7-10: four prediction markets (forecast, evidence, forecast, bet); one probe pair is a record of ten trial closes, the other a source's forecast"}
  price: {node: DISS-PRICE-DISPLAY, value: "the price is a display of the schedule's draw: at or below the cap exactly when the order fills; only the ordered good's own path is shown"}
  source_weight: {node: DISS-SOURCE-WEIGHT, value: "weight on a source's forecast = kappa_s * g; kappa_s unknown (.2-.5 examined)"}
  certification: {node: DISS-CERT-B, record: "records/basket_cert_I043.txt", value: "72 pairs: D1 and confirmatory pair 1.000 at P0-P3; at P4 (one-update rule) .947 / .893 / .790 for kappa_s .5 / .35 / .2; 96 pairs .973 / .913 at .35 / .2; FREEZE .77-.84 and ASSOC_H .23-.32 at kappa_s .35; sizes .004-.007; as a requirement at P4: 84 pairs at kappa_s .35, 96 at .2, 72 at .5; 60 under the count rule (I045, DISS-GATE-N)"}
  bet: {node: DISS-TEST-BET, value: "supporting; under an ASSUMED betting rule: 1.000 at P0-P3, .916-.994 at P4; size .002-.006"}
  excluded: "informative prices beyond the ordered good's own path, the other good's prices, the two-stage route task, live order matching, mixed baskets, a stated quota"

design_W:   # I044: the session as a live economy; certified on simulated sessions under ASSUMED order and trading rules; NOT built
  design: {node: DISS-DESIGN-W, record: "records/113_live_economy_I044.md; experiment/LIVE_ECONOMY.md", value: "two markets of N per session, each sees the other's recent fills; HIGH: focal scarce, neighbour rich; LOW: both scarce; six rounds of 120 clearings with one standing order (the good bid for); then claims on a simulated good with private forecasts and trading against a market maker. Gaps against the request: the order is not a basket; nobody sells in procurement"}
  control: {node: DISS-GOD-SCRIPT, value: "supply, values, tie-breaks, claims and interventions are scripted; the engine is a function of script and orders; twins share a script; any session can be replayed"}
  auctioneer: {node: DISS-AUCTIONEER, value: "units to the highest bids at the highest losing bid: the lowest market-clearing price (0 violations in 10.2 million clearings); bidding the value is dominant given the good (numerical; not machine-checked)"}
  unit: {node: DISS-INTERFERENCE, value: "the market is the unit; individual-level tests reject a true null in 2-5% at nominal 0.5% under session effects of .1-.2; market-level tests .40-.85%"}
  certification: {node: DISS-CERT-W, record: "records/market_cert_I044.txt", value: "12 + 12 sessions of two markets of six, frozen supply: H1a_M 1.000; D1_M 1.000-.999 at P0-P3, .894 at P4 (count rule .979); 8 + 8 sessions .653 at P4; session effect .2: .94-.97 at P1-P3, .410 at P4"}
  rules:
    - {node: DISS-INSTITUTION-EFFECT, value: "unit orders are needed: with shares legitimacy under HIGH stays at .938 and D1_M rejects in .025 (erosion .0052 against repair .0026 per clearing with unit orders; .0030 against .0060 with shares)"}
    - {node: DISS-BOARD-DISPLAY, value: "the board shows recent fills, never totals: with totals the control arm's legitimacy falls to .684 and D1_M to .856 (P1) and .271 (P4)"}
    - {node: DISS-SUPPLY-CALIBRATION, value: "rich supply scaled by 1.15 / 1.10 / 1.05 for 4 / 6 / 8 traders so that the neighbour fills .72; more, smaller markets (.861 / .811 / .633 at P4 for markets of 4 / 6 / 8 with a session effect of .1)"}
  layout: {node: DISS-LAYOUT-TRIPLET, value: "six per market, calibrated supply, D1_M at P4 without | with a session effect of .1: twin pairs 12 + 12 sessions (288 people) .926 | .774; triplets 12 + 6 (216) .900 | .588; triplets 16 + 8 (288) .980 | .770; the two markets of a LOW session correlate at +.16 to +.29 in fairness (DISS-LOW-COUPLING) and are analysed as one unit; triplets needed by market size and session effect: DISS-LIVE-N (I045)"}
  collective: [{node: DISS-PROCUREMENT-NULL, value: "procurement gives no market-level test (units sold differ by less than .01)"}, {node: DISS-TEST-PLAT2, value: "twelve records on a claim: .61 / .96 at P1 against a uniform slowdown rejected in .001-.008; defeated by disengagement that differs by arm; with each participant a unit .90 needs 288 per arm (one-update rule) and 168 (count rule) (I045)"}, {node: DISS-PRICE-READOUT, value: "under an ASSUMED trading rule the price response ratio tracks psi (.200 against .190); its test .94 at P1, .45 at P4"}]
  theory: [{node: DISS-BASKET-EXISTENCE, value: "a completion payment makes goods complements: clearing prices may not exist; divisible goods give existence and remove the contrast; a round target served by unit orders keeps the institution (not certified)"}, {node: DISS-SORTING-BENCHMARK, value: "expected price (n - k)/(n + 1), expected surplus k(k + 1)/(2n(n + 1)); six traders in a scarce market split 4 : 2 on surplus, 5 : 1 on the chance of a fill; fill rate .19-.20 (model .18)"}]

staged_validation:   # I045: participants by step, from simulated cohorts under the kernel and ASSUMED human parameters; the steps are a proposal, not an approved plan. Decided on 2026-11-17: the first wave is a pilot (DISS-PILOT-DECISION)
  budget: {node: DISS-STAGED-BUDGET, record: "records/114_staged_power_I045.md; records/staged_power_I045.txt", value: "people for .90 at one-sided .005, binding point: first wave 192 (144 with three entitlement items); gate 168 (one-update rule) or 120 (count rule); rival test 576 or 384 with two record pairs, 960 or 480 with the probes as built; live economy 288 / 360 / 576 at six per market and 240 / 288 / 384 at four for session effects 0 / .1 / .2. Core (first wave, gate, live at four per market) 504-648; every rung 1,128-1,584"}
