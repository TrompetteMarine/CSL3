  first_wave: {node: DISS-WAVE1-CHECKS, value: "one cell of the built app, 96 pairs (72 with three entitlement items): fairness 24 pairs, entitlement 96 (48), strong PHI violation 60, count of outcomes per round 36, main-study size within +-24% at 72"}
  round_count: {node: DISS-ROUND-COUNT-READOUT, value: "a classifier on the twelve mean ratings of one cell picks the count of outcomes per round (40, 80, 120): correct in .976 | .917 of waves of 24 pairs and .994 | .951 of 36 with the gate point known | unknown (worst cell); the recovery test needs 30-36 control participants and is not clean at the repair edge; two cells between participants need 84 per cell"}
