  closed_form: {node: DISS-CLOSED-FORM-LOW, value: "n = 14.88 (s_H^2 + s_L^2) / (m_L - m_H)^2 runs low (72 against 84; 23 against 30; median 63 from a wave); a lookup needs the simulated correction"}
  completion_gate: {node: DISS-COMPLETION-GATE-COST, value: "a basket that ends the bidding: 20 of 30 expected fills triples the requirement at the anchoring edge (240 pairs against 72-84), 15 needs 576, 10 more than 576; live economy with a basket of 15: 6-10 triplets at P1, 20 to more than 32 at P4"}
  live: {node: DISS-LIVE-N, value: "triplets at P4 for session effects 0 / .1 / .2: 8 / 10 / 16 at six per market, 10 / 12 / 16 at four (one-update rule); 6 / 8 / 12 and 8 / 10 / 12 (count rule); four per market needs fewer people and more sessions"}
  institution: {node: DISS-TEST-INSTITUTION, value: "unit orders against shares in their own triplets: fairness contrast 4 triplets per institution at P1, 6-8 at P4; uptake contrast 6-10 and 12-20"}

