iteration_id: "KGi-DISS-I006"
mode: "experimental instantiation: oTree build of task v3 + analysis pipeline + design doc;
  no manuscript changes, no new scientific claims, no registration/recruitment actions"
freeze_time: "2026-11-04T11:10Z (before any experiment code is written)"
baseline: "prereg draft (I003/M4, project doc) is the governing spec; I001-I003 frozen
  bundles for all parameter values; identification fallback of prereg section 7 is final"
spec_mapping:  # prereg clause -> implementation unit (frozen before coding)
  task: "two-armed bandit, 450 trials, one oTree app 'diss_bandit'; trials via live_method
    pages (one per 150-trial block) with ExtraModel trial rows + custom_export"
  phases: "P1 trials 1-150 arms (.65,.35); P2 151-300 (.30,.15); P3 301-450 restoration;
    phase boundaries INVISIBLE to participants (no UI cues)"
  factor_A: "reference regime per 150-trial block (HIGH: yoked peer stream in .60-.70
    earnings band; LOW: peer matched to own trailing band); primary contrast = P2-block
    regime; realized block sequences fixed in session config"
  factor_B: "P3 restoration level: FULL = (.65,.35); MODERATE = (.45,.35) - MODERATE is a
    CALIBRATION PARAMETER (pilot-gated, must sit near the resignation boundary at typical
    elicited entitlement; value marked as I006 design decision for author review, not
    prereg-frozen)"
  bonus: "announced non-contingent bonus every 15th trial (windfall probe), 3 points,
    parameterized"
  sliders: "every 5 trials: fairness 0-100 ('the payout rule is fair') and entitlement
    0-100 ('what I deserve per trial', percent of max payout) - the identification lever"
  yoking: "no deception: peer panel replays an ACTUAL earnings stream from a prior
    participant (pool loader); dev/pilot pool generated by bots and FLAGGED placeholder;
    attribution line in instructions truthfully implemented via separate throwaway sessions"
  cells: "4 (A x B) x 320 post-exclusion + pilot cells; ~28 min; Prolific"
  exclusions: "completion <90%; zero slider variance; P1 accuracy below chance + 2SE;
    median RT < 300 ms - implemented in the analysis pipeline, not silently in the app"
deliverables_and_gates:
  D1_app: "oTree 5 app diss_bandit (models, live pages, templates, instructions with the
    attribution line, payment conversion); gate: otree devserver boots + otree test bots
    complete a full 450-trial session without error"
  D2_bots: "two bot families driving the SAME app: random bot; DISS-gate bot using frozen
    defaults (nuF=.05, nuR=.0125, tauF=.3, phi=(1,.25), alpha=.2) with slow/fast rho and
    chi variants, emitting choices AND slider responses from the model state; gate: bot
    data lands in the custom export schema"
  D3_pipeline: "analysis pipeline (Python) reading the export: exclusion rules, H1 Welch
    test, H2 condition x measure interaction + recovery-midpoint lag, H3 reference x
    restoration interaction on P3 rating slope, H4 mixed-effects increment asymmetry,
    H5 shared-failure contrast (pilot-gated), rho-rigidity moderator (entitlement-slider
    adaptation speed, model-free); gate: runs END-TO-END on bot data and emits a smoke
    report; NO claims from bot data beyond pipeline validation"
  D4_design_doc: "experimental-design + ethics-readiness doc (sessions, randomization,
    yoking procedure, payment, pilot gates incl. H5 gate and MODERATE calibration,
    exclusion audit trail) -> project doc for author review before OSF"
  D5_records: "freeze closing record, continuation report to project, memory append,
    bundle delivered"
out_of_scope: "OSF registration, ethics submission, Prolific setup, recruitment, the new
  Rust+Julia repo (separate decision), manuscript edits"
honesty_rules:
  - "every numeric default traces to a frozen bundle value or is explicitly marked
    'I006 design decision, author review required'"
  - "bot-generated data is for pipeline validation only and is labeled as such in every
    output it touches"
