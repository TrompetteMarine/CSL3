iteration_id: "KGi-DISS-I041"
mode: "certification on synthetic cohorts; no human data; no recruitment, OSF filing or ethics
  claim; manuscript not edited. Written before any I041 run."
freeze_time: "2026-11-11T21:35Z"
freeze_relative_to_work: "done before freezing: design_generator.measure_design re-read (rating
  shapes M1-M6). Nothing simulated."
baseline: {repo: "CSL3 main d689e3a (I040 close)", lean: "CSL lean-diss-core 11f09cb",
           kg: "kg_delta_I032 ... I040; kg_active_I040.yaml", tests: "78 passing"}
author_directive: "2026-11-11: go for the yoked design first; it will be pilot tested."

design_Y:   # the object certified
  base: "S1x: 1 rich round + 5 deprivation rounds of 120 settlements with a summary screen,
    a ticket choice before each round, fairness and entitlement ratings after each round,
    then 4 probe tickets (two pairs, 10 settlements shown each); ten repetitions"
  yoking: "participants come in pairs: one HIGH, one LOW, same schedule. A schedule fixes,
    before the session: the rich-round board (HIGH or LOW, the same for both), for every
    settlement one uniform draw that settles BOTH tickets (so the same ticket gives the same
    outcome to both, and the better ticket wins whenever the worse one does), the board
    draws, and the probe tickets' records. People choose their own tickets and give their
    own ratings and forecasts."
  allocation: "each schedule is used once in each arm; arm order within a schedule at random"
  not_changed: "odds, board level, round length, ratings, probe, payment rules"

simulation:
  pairs: "twins_I040.twins extended (defaults unchanged, so the I040 records still re-run):
    independent ticket-choice noise and independent rigidity within a pair; an option to give
    both members the LOW board (null pairs). Probe statistic from probe_generator at
    forecast noise 12. Ratings with shapes M1 (plain), M2 (15% parked), M3 (20%
    non-responsive), M5 (lognormal gain), gain .25 / .5 / 1, noise 5.8."
  pool: "20,000 pairs per cell; decisions on 2,000 samples of n pairs; seed 138000"
reporting_set:   # computed by experiment/analysis/yoked_analysis.py, the code the pilot will use
  H1a: "last fairness rating, LOW above HIGH within pairs: signed-rank, one-sided .005"
  K3: "last entitlement rating, HIGH above LOW within pairs: signed-rank, one-sided .005"
  D1: "psi < 1: upper limit of the 99% Fieller interval below 1 (unpaired formula; a paired
    version with the within-pair covariance is computed alongside)"
  FREEZE: "third of HIGH with the lowest last fairness rating: upper limit of its uptake
    ratio below .5"
  ASSOC: "pooled within-arm rank association of T and the last fairness rating, one-sided .005"
  PHI: "warning flag: slope of the change in the LOW fairness rating on the round's win
    share (rounds 4-6) below 0 at one-sided .005"
  confirmatory_pair: "H1a, then D1 only if H1a rejects"
  full_set: "H1a and K3 and D1 and FREEZE and ASSOC and no PHI flag"
claims:   # at 72 pairs unless stated; full coupling; shape M1, gain .5 unless stated
  C1_H1a: "power >= .99 at every gate point; >= .95 at gain .25 at P0-P3 and >= .80 at P4;
    >= .95 at P0-P3 under M2, M3 and M5"
  C2_K3: "power >= .99 at every gate point under M1; >= .90 under M2, M3, M5"
  C3_D1: "unpaired: >= .93 at P4 under the one-update rule, >= .99 elsewhere; the paired
    interval changes power by at most .01"
  C4_FREEZE: ".88-1.00 at P1-P4 under both rules"
  C5_ASSOC: ".60-.90 at P1-P3, >= .99 at P4, .10-.35 at P0"
  C6_PHI: "flag rate <= .02 at every gate point"
  C7_pairs: "confirmatory pair (H1a and D1): >= .93 at every point"
  C8_full: "full set as predicted: .50-.85 at P1-P3, >= .85 at P4, <= .30 at P0 (one-update
    rule); 5-15 points higher under the count rule at P1-P3"
  C9_n: "at 36 pairs the confirmatory pair is >= .90 at P0-P3 and .55-.80 at P4 (one-update);
    at 96 pairs >= .98 everywhere"
  C10_size: "null pairs (both members on the LOW board): H1a, K3, D1 each <= .008. Ratings
    move but the gain does not (coupling 0): D1 <= .008, FREEZE <= .008, ASSOC <= .008.
    Homogeneous slowdown (every HIGH participant at the HIGH mean gain): ASSOC <= .008,
    FREEZE <= .05."
  C11_yoking: "against unyoked pairs (LOW members re-matched at random), yoking changes the
    power of H1a by 0 to +.05 at 18 and 36 pairs at P4 and by less than .01 elsewhere"
artefacts:
  schedules: "experiment/tools/yoked_schedules.py: writes the pre-drawn schedules and the
    allocation for a given number of pairs from a seed; verified by tests (same uniform
    settles both tickets; each schedule once per arm; realised win rates match the odds)"
  spec: "experiment/YOKED_DESIGN.md: the design, the yoking protocol, what is recorded, the
    reporting set with its decision rules, and what stays author-gated"
gates:
  G1: "extended twins() reproduces records/twins_I040.txt bit for bit at its defaults"
  G2: "all tests pass; seeded I041 records re-run bit-identical"
  G3: "KG delta validated; active ledger updated"
  G4: "no recruitment, OSF filing, ethics claim or manuscript edit; no credentials; referee
    documents stay out of the repositories"
stopping: "close after the certification, the two artefacts and the KG update. The oTree
  build and the pilot specification are separate steps."

# =================================================================== SCORECARD
scorecard:   # verbatim, 2026-11-11; record records/yoked_cert_I041.txt (seed 138000)
  G1: "PASS. records/twins_I040.txt re-ran bit-identically after twins() was extended."
  C1_H1a: "PASS. 1.000 at every point for plain ratings at every gain; >= .947 in every shape
    and gain cell (lowest: P4, non-responsive shape, gain .25)."
  C2_K3: "PASS for plain ratings at gain .5 (.999-1.000). FAIL for the other shapes at gain
    .5: parked .999 / .949 / .950 / .965 / .808 (P0-P4); non-responsive .998 / .881 / .890 /
    .862 / .625; lognormal gain 1.000 / .977 / .984 / .981 / .775. At gain .25: .65-.91
    plain, .17-.46 parked or non-responsive (P1-P4)."
  C3_D1: "PASS. .939 at P4 (one-update), .996 (count), 1.000 elsewhere; paired interval .936
    against .939."
  C4_FREEZE: "PASS. .900-.924 (one-update), 1.000 (count rule)."
  C5_ASSOC: "PASS. P1-P3: .667 / .639 / .780 (one-update), .800 / .764 / .869 (count); P4
    1.000; P0 .204 / .205."
  C6_PHI: "PASS. Flag rate at most .013."
  C7_pairs: "PASS. Confirmatory pair .939 at P4 (one-update), >= .996 elsewhere."
  C8_full: "PASS on the levels (one-update: .198 / .632 / .601 / .728 / .855 at P0-P4). The
    count-rule gain at P1-P3 is 14-16 points, one point above my 5-15 at P1 and P2."
  C9_n: "PASS. 36 pairs: .992-1.000 at P0-P3, .665 at P4. 54: .849 at P4. 96: .986 at P4."
  C10_size: "PASS except one claim. Null pairs: H1a .0035, K3 .0065, D1 .0055. Ratings move
    but the gain does not: D1 .0050 / .0055, FREEZE .0000, ASSOC .0040. Homogeneous
    slowdown: ASSOC .0045; FREEZE .893 at P1 and .051 at P4 (I predicted <= .05): under a
    homogeneous slowdown the stratum's uptake IS below half of normal, so FREEZE is a true
    statement there and does not discriminate. Full set: .0045 / .0020."
  C11_yoking: "PASS as stated, and the substance is that yoking buys nothing: H1a yoked |
    re-matched .726 | .724 (18 pairs) and .990 | .990 (36) at P4; at gain .25 .570 | .593
    and .958 | .957."
  seen_after_the_run: "with independent ticket-choice noise the members of a pair pick the
    same ticket in every deprivation round in only 10-16% of pairs (41-73% in I040, where
    the choice noise was shared). In null pairs ASSOC rejects in .815: the association is a
    property of the gate under either board, not an error."

# =================================================================== ADDENDUM AD-Y2
# Written 2026-11-11 after the scorecard above and before any AD-Y2 run.
addendum_AD_Y2:
  why: "the homogeneous-slowdown world scored in C10 has an ungated LOW arm (every LOW
    participant at full gain). The null pairs show that a gated LOW arm carries a T-F
    association of its own (ASSOC .815 with two LOW arms). ASSOC is pooled over both arms, so
    it may reject when the gate works in LOW only and the HIGH board acts by a uniform
    slowdown. The C10 figure (.0045) would then say nothing about that world."
  seen_before_freezing: "records/yoked_cert_I041.txt in full; I040 section B (within HIGH,
    72 per arm, one-update rule: rank correlation .29-.41 at P1-P3, top quarter against the
    rest .41-.53; count rule .62-.80). The predictions below are back-of-envelope from those
    figures under a normal approximation; nothing new simulated."
  world_hs_g: "LOW exactly as the model (gate at full coupling). HIGH: ratings as the model,
    every participant revising at the HIGH mean gain."
  statistics:   # added to yoked_analysis.py; decisions() keeps its frozen outputs
    ASSOC_H: "rank association of T and the last fairness rating within HIGH only, one-sided .005"
    ASSOC_L: "the same within LOW only"
    TOPQ: "within HIGH, the top quarter by rating against the rest: rank-sum test that the
      top quarter revises more, one-sided .005 (the best of three cuts in I040; fixed here
      before the run)"
    FULL_H: "the full set with ASSOC replaced by ASSOC_H"
    FULL_T: "the full set with ASSOC replaced by TOPQ"
  run: "experiment/analysis/yoked_ad_I041.py, seed 138100, 20,000 pairs per cell, 2,000
    samples; P0-P4; both revision rules; 72, 144, 216, 288 pairs"
  claims:
    Y1_by_arm: "model, 72 pairs, one-update rule, P1-P3: ASSOC_L .30-.55; ASSOC_H .25-.45.
      At P4: ASSOC_H >= .95."
    Y2_hs_g_pooled: "hs_g at 72 pairs (one-update): ASSOC rejects in .10-.30 at P1 and at P4;
      FULL .08-.27 at P1 and <= .03 at P4. At 216 pairs ASSOC rejects in .50-.80 at P1."
    Y3_hs_g_high_only: "hs_g: ASSOC_H, TOPQ and FULL_H, FULL_T each <= .008 at 72 and at 216
      pairs. Ratings move but the gain does not (P1): ASSOC_H and TOPQ <= .008."
    Y4_full_high_only: "model, 72 pairs, one-update rule: FULL_H .20-.42 and FULL_T .33-.52
      at P1-P3; both >= .85 at P4. Count rule: FULL_T .55-.80 at P1-P3."
    Y5_n: "model, one-update rule, P1-P3: ASSOC_H .50-.75 at 144 pairs, .72-.92 at 216,
      >= .85 at 288; TOPQ >= .72 at 144 and >= .90 at 216."
  consequence_if_Y2_holds: "the pooled association is not a test of the gate against a
    homogeneous slowdown of the HIGH arm; the reporting set states the association by arm,
    with the HIGH-arm statistic as the one that bears on that rival. The I039 conjunction
    figure for HS (.0035) is then scoped to a world with no state dependence in LOW."

scorecard_AD_Y2:   # verbatim, 2026-11-11; record records/yoked_ad_I041.txt (seed 138100)
  Y1_by_arm: "ASSOC_H PASS: .275 / .399 / .366 at P1-P3 and .998 at P4. ASSOC_L FAIL at two
    points: .443 / .185 / .571 against my .30-.55 (at the repair-ratio edge the LOW arm sits
    nearer the ceiling and carries less)."
  Y2_hs_g_pooled: "PASS, and this is the finding. With LOW gated and HIGH uniformly slowed,
    the pooled association rejects in .192 (P1) and .203 (P4) at 72 pairs and in .659 (P1)
    at 216; the full set comes out 'as predicted' in .161 at P1 (72 pairs), .653 at 216,
    and .009 at P4. Count rule: .158 / .158 at 72, .581 at 216."
  Y3_hs_g_high_only: "PASS except one cell by .0005: ASSOC_H .0025-.0080, TOPQ .0030-.0085,
    FULL_H <= .0080, FULL_T <= .0085 (the .0085 is P1, 216 pairs, one-update rule; Monte
    Carlo standard error of a rate of .005 on 2,000 samples is .0016). Ratings move but the
    gain does not: <= .0070."
  Y4_full_high_only: "PASS at P1-P3: FULL_H .269 / .392 / .360, FULL_T .379 / .506 / .431;
    count rule FULL_T .573 / .781 / .672. FAIL at P4 for FULL_T: .822 against >= .85
    (FULL_H .863); the top-quarter cut is worse than the rank correlation at the anchoring
    edge (.945 against .998)."
  Y5_n: "ASSOC_H: 144 pairs .581 / .757 / .692 (P2 is .007 above my band), 216 pairs .759 /
    .907 / .876, 288 pairs .892 / .981 / .960: PASS but for that. TOPQ FAIL at P1: .707 at
    144 pairs (I said >= .72) and .886 at 216 (>= .90); .856 / .801 and .961 / .943 at P2, P3."
  seen_after_the_run: "at P0 the HIGH-arm statistics sit at their size (.004-.009): when
    everyone in HIGH has stopped, the gate and a homogeneous shutdown are the same
    distribution. Two independent pools give the pooled association at 72 pairs as .667 and
    .696 (P1), .639 and .608 (P2), .780 and .825 (P3): association rates carry about +-.03
    from the pool."
  consequence: "adopted. The reporting set states the association by arm. The HIGH-arm
    statistic is the one that bears on a homogeneous slowdown. The 'full set' is redefined
    with it (FULL_H); the frozen FULL is kept in the code and the records."

closing_record:   # 2026-11-11
  outcome:
    survives: "the yoked design as an instrument (sizes hold; nothing breaks); the
      confirmatory pair H1a then D1 (.94-1.00 at 72 pairs across the trap region); K3 with
      plain ratings; FREEZE as a description of the lowest-rated third; the PHI flag at its
      size; the schedule generator"
    corrected: "the association is reported by arm, not pooled; the HIGH-arm statistic is the
      one that bears on a homogeneous slowdown; the whole set is redefined with it"
    refuted: "yoking gives a power gain (none); the pooled association with psi < 1 rejects a
      homogeneous slowdown (only if LOW is ungated; with LOW gated the rival passes in .16 at
      72 pairs and .65 at 216); FREEZE discriminates that rival (it is true under it); K3 is
      robust to the rating shape (.63-.98 at gain .5, .17-.46 at gain .25 with parked or
      non-responsive sliders); five of my bands in AD-Y2 at single points"
    unresolved: "nothing has been tested on people; the design is not built. At 72 pairs the
      gate is not separated from a homogeneous slowdown of HIGH at the central gate points
      (ASSOC_H .27-.40; .90 needs 216-288 pairs under the one-update rule, 144-216 under the
      count rule; at P0 the two coincide). Mediation by fairness is not identified by any
      statistic. The association by arm was scored with plain ratings only."
  gates:
    G1: "PASS. records/twins_I040.txt re-runs bit-identically with the extended twins()."
    G2: "PASS. 84 tests pass (78 + 6 new). Re-run bit-identical: records/yoked_cert_I041.txt
      (also after decisions() gained the by-arm outputs), records/yoked_ad_I041.txt, the
      example schedule file."
    G3: "PASS. freezes/kg_delta_I041.yaml: 6 new nodes, 9 updates, no id collision, edges and
      updates resolve, requires-graph acyclic over the seven deltas. freezes/
      kg_active_I041.yaml: 38 node references resolve; kg_active_I040.yaml marked superseded."
    G4: "PASS. No recruitment, OSF filing, ethics claim or manuscript edit; no credentials;
      no referee documents in the repositories."
  author_decisions: "sample (72 pairs for the confirmatory pair, or 216-288 to separate the
    gate from a homogeneous slowdown); which HIGH-arm statistic to fix in advance (rank
    association or top-quarter cut); whether K3 stays supporting only"
  next: "I042 candidates: (1) the ten-repetition oTree build of the yoked design; (2) the pilot
    specification built on this ledger (what each pilot quantity decides, including the
    revision rule that sets the sample for ASSOC_H); (3) the association by arm under rating
    shapes M2-M6 and under other slowdowns; (4) Lean: the two-type lower bound and a
    monotone-kernel T13."
