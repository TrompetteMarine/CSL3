pre_run_addendum_1: "task_v3_predictions missing pins, fixed BEFORE first generator run:
  A0=0.5 (neutral start; P1 adapts it upward), L0=1, pi0=.9; peer display anchor = peer
  running rate; slider cadence every 5 trials (prereg); rival auxiliary slider links for
  the H4 panel: trust slider = 100*pi_fair, entitlement slider = adaptive own-earnings
  expectation with rate .02 (the identification-screen convention); DISS sliders =
  100*L, 100*A"
pre_run_addendum_2: "race_anatomy correction, declared BEFORE re-running: seed 38001
  produced an escape run (the ~16% minority at the confirmatory cell), unsuitable for a
  figure captioned as the modal trapped trajectory. Rule fixed now: for the rho=.002
  panel, advance through the pre-declared sequence 38001, 38011, 38021, ... and take the
  FIRST seed whose run satisfies the frozen defensive-wrong criterion (m2<.3, L2bar<.3);
  record the chosen seed and the number of candidates skipped in race.csv header comment.
  rho=.02 stays at seed 38002 (modal: rescued). Mechanism note from the first render,
  recorded for caption honesty: in the rescued run aspiration does NOT cross A*(mu2);
  fast adaptation shrinks the discomfort margin, the gate never absorbs, correction
  arrives through a partly open gate, and repair proceeds because post-correction
  outcomes are the superior arm's with A below A*(mu1)=.675. Captions and text must
  state THIS mechanism, not the mean-field idealization."
