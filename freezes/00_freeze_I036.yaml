    outcome = forecast revision. Gate: revision weight w = 1 - (1 - .2 L)^m, so HIGH
    (lower L) revises less than LOW. R3 and its slow-reporting variants: no arm difference
    (legitimacy is not in their learning rule). R4: no arm difference. R1: opposite sign."
  computation: "L at the end of round 7 from design_generator (12k per arm, theory points
