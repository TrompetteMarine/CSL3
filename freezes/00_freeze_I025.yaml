experiment_redesign:  # the division-of-labour principle, applied
  principle: "simulation answers every question that does not require a human
    (collective dynamics, robustness, scale, effect-size generation); the human grid
    is the smallest that (i) confirms the one confirmatory prediction and (ii)
    identifies what no simulation can: whether the gate exists in people (the
    restoration dissociation) and the human distribution of aspiration rigidity
    (the lab-to-field instrument)"
  structure: "serial gatekeeping, FWER 0.005, no alpha split: H1a (one-sided Welch,
    P1->P2 fairness drop, HIGH vs LOW reference) tested first; H1b (gate existence:
    under HIGH x MODERATE restoration, choice accuracy recovers above a pre-stated
    floor while rated fairness stays inside an equivalence band +/-delta_eq that
    excludes the utility rival's predicted recovery) tested only if H1a rejects"
  allocation: "reference arms HIGH/LOW, N=280 per arm POOLED across restoration arms
    (every participant contributes to H1a because restoration diverges only in P3);
    within each reference arm, MODERATE:FULL = 2:1 (~187:93) — mass where H1b lives,
    FULL retained as the positive control that the fairness instrument can move
    (without it a MODERATE flatline is confounded with slider insensitivity) and as
    the H3 threshold secondary. Total N = 560 (vs 1,280 on the 4x320 reading):
    participants minimized by pooling H1a across restoration arms and by demoting
    FULL to control-sized cells"
  power: "H1a: 0.908 at the d=0.33 design basis (N=280/arm, alpha=.005 one-sided);
    the erroneous 'powered at d=0.25' sentence is REMOVED (round-3 unanimous catch:
    actual power 0.72 at that floor). d=0.25 reported, if at all, as a smaller
    effect of interest with its true power stated. H1b: equivalence power requires
    pilot sigma_r — delta_eq and final N are pilot outputs; the pilot precedes
    filing (94_referee_implementation_plan_I024.md keystone). Model-implied effect
    sizes stay labelled upper bounds (SI), used only to show the design is not
    powered at the edge of its own theory"
  rho_instrument: "the entitlement-slider rho measurement is within-subject and
    needs no cells of its own — every participant yields a rho posterior (the P-C
    prior instrument), which is exactly 'what the ABM cannot supply'"

