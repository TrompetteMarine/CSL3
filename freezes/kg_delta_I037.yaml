  - "AD-A2 level (correction time 1200-1400 at c = 1): 979"
  - "EB2 (S1 <= 150 per arm): 274"
  - "EB3 (one-update rule needs fewer participants): needs more"
  - "AD-B2 (interior optimum in draws per round; n 120-220): threshold, n 72"
  - "EB4 (asymptotic n within .03 of .90): .950"
  - "EB6 (raw false positives >= .5 under 20% disengagement): .24-.27"
  - "AD-B3 (starting entitlement .4 lowers power materially): .93-.94"
  - "S2 (control-source design) adequately powered at its asymptotic n: .797 at the binding point"

flags_not_patched: "the headline trap requires, together: gate speed >= ~.9, repair/erosion
  ratio <= .29, conformity at the tipping gap, and >= ~90% discounting on both channels"
integrity: {proof_cycle_check: pass, ids_unique: checked_against_prior_deltas,
            application_bridge: "synthetic only; every human reading open until the pilot"}
persistence: "CSL3 freezes/kg_delta_I037.yaml + Project mirror; no remote KG service"
