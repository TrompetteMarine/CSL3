# =================================================================== WHAT MAY NOT CHANGE
invariants:
  I1_server: "diss_market/engine.py and diss_market/bots_model.py stay byte-identical. In
    diss_market/__init__.py only what a page hands to its template or script for display may change: no model
    field, form field, validation, page order, payoff, export column or bot."
  I2_information: "every page shows the same data as before, at the same moment, and nothing more: the same
    numbers and words, the same order of appearance within a reveal, the same durations (reveal_ms,
    probe_reveal_ms, source_reveal_ms, the 500 ms pause) and the same pacing functions. Aids that carry no
    outcome (where one is in the session, how far a reveal has run, which items are answered) may be added."
  I3_wording: "every string of diss_market/copy_en.py stays as it is, character for character. New visible
    strings: at most 2, each marked DRAFT in the file and listed in the memo. Planned: none."
  I4_arms: "one set of templates, styles and scripts for both arms; two members of a pair who make the same
    choices get the same pages except for the board's numbers."
  I5_measures: "rating sliders: pre-drawn start, hollow until touched, step 5, no number shown, every slider
    must be touched; forecast slider: no handle until placed, step 5, the value echoed; bets, recall and closing
    questions as now. What is stored about them (values, start positions, moves, first touch, timings) is
    unchanged."
  I6_colour_rule: "goods carry colour (Square #2a78d6, Triangle #eb6834); the trader is drawn in slate and a
    source in ink; YES #1f9d55 and NO #c93a9a appear on the bet buttons and the settled markets only, with the
    word; nothing on a procurement screen (order, clearing, rating) is green or red. One light theme."
  I7_isolation: "no request leaves the study server; fonts ship with the app under an open licence; no name,
    logo or layout of a real market."
  I8_access: "reduced-motion behaviour (the stepped reveal, no pulse) and keyboard use are kept."
  I9_leaks: "no page carries a later round, the other good's prices, a market's evidence before its first
    forecast, a bet price before the second forecast, or how a market settles (gates G5 and H2 of I042, I043)."

# =================================================================== WHAT THE POLISH COVERS
design_decisions:   # taken before building; anything else is detail
  D1: "clearing page: one instrument on one sheet. Price above, running counts of filled orders below, on one
    shared time axis at full width, the two counters (You, Trader) between them with equal weight. The same
    structure at every screen width."
  D2: "one sheet per page on a tinted ground; sheet width about 720 px for forms and text, about 1120 px for the
    clearing page."
  D3: "typeface chosen from specimens rendered on the real screens. Candidates: IBM Plex Sans as now; IBM Plex
    Sans with IBM Plex Sans Condensed for figures and labels; Mona Sans; Archivo. Criteria in order: body text
    legible at 16 px on an ordinary screen; figures of equal width, 0 and O, 1, l and I told apart at 12 px;
    open licence, shipped with the app; all fonts together at most 160 KB; character. The specimens and the
    choice are recorded."
  D4: "colours: the values of I6 stay. Neutrals and tints may be retuned inside the contrast gate. The focus
    ring becomes ink; it was Square's blue, which could mark the Triangle card."
  D5: "top bar: the ten steps stay; the current step also shows how far into the round one is, without words."
  D6: "rating page: a mark on each answered item and a four-pip count beside the button, without words."
  D7: "hover on the cleared chart: the same readout text, shown beside the pointer."
  D8: "instructions: headings hang beside the text on wide screens; the chart legend becomes a small annotated
    example with one filled and one unfilled order; a legend of the two goods. Words already in the file only."
  D9: "motion: one page cross-fade as now; state changes of 120-240 ms. Nothing celebrates or punishes an
    outcome: no flash, shake or burst tied to a fill, a miss, a basket or a bet."
  D10: "page title and tab icon: the brand name and its mark (the framework sends an empty title)."
  D11: "the page declares its language (the framework sends none)."
  D12: "charts keep the mark rules used since I043: 2 px lines, ringed end dots, solid hairline grid, a dashed
    line only for the cap or the threshold, text in text colours."
harness: "tools/browser_run.py gains checks (visible text per page, counts of chart marks, stored slider
  values against the values dragged, an accessibility audit with axe-core loaded from a local file, a
  keyboard-only session, layout fit at five sizes, a scan of colours in use, frame times). No existing check
  is weakened. A page hook is renamed only if listed in the memo. The baseline is measured with the extended
  harness on the tree of c73284a."
risks_stated_before:
  - "the display is part of the stimulus. D1 changes how the price, the participant's count and the trader's
    count are laid out. Both arms get the same change and no human data predates it, but how strongly people
    attend to the board is a human quantity the certification assumed."
  - "a clearer display may change how many outcomes a person takes from a round (DISS-EFFECTIVE-DRAWS), the
    quantity the pilot is run to read."

