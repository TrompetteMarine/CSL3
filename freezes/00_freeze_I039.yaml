# =================================================================== PART M: MINIMAL SCENARIO
part_M_minimal_scenario:
  definition: "Sigma = what design S1x already records per participant, nothing added:
    arm (HIGH / LOW), the last fairness rating F (end of the deprivation rounds), and the
    probe statistic T."
  why_minimal: "P1-P3 need two arms and one gain measure (T). P4-P6b need a second coordinate
    that tracks the gate state person by person; F is that coordinate and is already there."
  observable_implications:
    O1: "psi = E[T | HIGH] / E[T | LOW] < 1  (kernel and reference; first moment)"
    O2: "state dependence, the negative of mean sufficiency: Cov(T, F | HIGH) > 0 whenever
      c > 0 and legitimacy varies within HIGH. Reason: given l, T and F are independent and
      both conditional means increase in l, so Cov(T, F) = Cov(E[T | l], E[F | l]) >= 0."
    O3: "freeze in observable form: at c = 1 participants at the bottom of the fairness scale
      do not revise (E[T | HIGH, collapsed] = 0)"
  rivals_in_Sigma:
    R3: "psi = 1; no T-F association"
    HS: "homogeneous slowdown (HamJenkins2025 class): everyone in HIGH revises less by the
      same factor whatever they report: psi < 1; no T-F association"
    SH: "static heterogeneity: a trait moves both the rating and the revision weight in both
      arms: psi = 1; T-F association in BOTH arms"
  statistics:
    E1: "psi-hat (I038)"
    E2a: "one-sided Spearman test of T-F association within HIGH"
    E2b: "difference of the two within-arm associations, HIGH minus LOW (Fisher z of
      Spearman, variance 1.06/(n-3) each), one-sided; protects against SH"

# =================================================================== PART L: LIKELIHOOD
part_L_likelihood:
  generator: "ABM agents perform the ten-repetition task (design_generator, gate kernel) at
    the gate points P0-P4. Their legitimacy at probe time gives the empirical distribution
    G_arm (200,000 agents per arm and point, seed 136000)."
  kernels:
    k_T: "k(t | w): exact distribution of the probe statistic for a participant with revision
      weight w, computed without Monte Carlo from the report model (prior clipped normal,
      two rounded and clipped normal reports per ticket, four tickets): cross-correlation of
      report distributions, quadrature over the prior, convolution over tickets"
    h_F: "h(f | l): rating rounded to 5 and clipped, mean 50 + a (100 l - 50), s.d. sigma_r"
  likelihood:
    T_only: "p(t | arm; theta) = q k(t | 0) + (1 - q) * integral of k(t | w(l; c)) dG_arm(l)"
    joint: "p(f, t | arm; theta) = integral of h(f | l) [ q k(t | 0) + (1 - q) k(t | w(l; c)) ] dG_arm(l)"
  parameters:
    structural: "c"
    nuisance: "kappa (baseline weight; event rule) or alpha (count rule); sigma_f; q; a;
      sigma_r; lambda (depth of delegitimation: G = (1 - lambda) G_point + lambda G_other,
      G_other = the P4 distribution at P1 and the P1 distribution at P4)"
  objects:
    score: "s_j(x) = d log p(x; theta) / d theta_j (central differences on exact tables)"
    information: "I = (I_HIGH + I_LOW) / 2 per participant under equal allocation"
    efficient_influence_function: "phi_eff = grad(psi)' I^-1 s; bound = grad(psi)' I^-1 grad(psi)"
    plug_in_influence_function: "phi_np(arm, t) = 2 [ 1{H}(t - mu_H) - psi 1{L}(t - mu_L) ] / mu_L"
    relative_efficiency: "RE = bound / Var(phi_np)"
  gates:
    GK: "exact kernel against the simulator at w in {0, .2, .435, .85}: total variation <= .01
      with 1,000,000 simulated participants; mean within .1 forecast points"
    GR: "regularity of the plug-in: |E[phi_np s_j] - d psi / d theta_j| <= 2% of the largest
      gradient entry, for every parameter"

# =================================================================== PART F: FRONTIER
part_F_frontier:
  estimation:
    claim_RE: "T only, gate point known, (c, kappa, sigma_f, q) unknown: the ratio of means
      reaches RE between .60 and .95 of the information bound for psi at P1 and P4"
    claim_FT: "adding F raises the oracle information for c by a factor >= 2 at P1 and P4"
    claim_depth: "with the depth of delegitimation (lambda) unknown, T alone carries at most
      10% of the lambda-known information for c at P1; with (F, T) at least 50% is kept"
    claim_cert: "from (F, T) with all nuisances unknown, the bound on s.e.(c) at 72 per arm
      is between .05 and .12 at P1 and P4; certifying c >= .90 against c = 1 at one-sided
      .005 with power .90 needs 200-700 per arm"
  testing:
    claim_NP: "most powerful test of c = 0 against c = 1 at a known gate point with known
      nuisances (Neyman-Pearson; exact tables; 20,000 replicates): n per arm for power .90
      at .005 is 35-60% of what the interval needs (24 at P1, 60 at P4, event rule)"
    claim_GLR: "with kappa profiled the likelihood-ratio test needs at most 1.3 times the
      Neyman-Pearson n"
  coverage:
    claim_cov: "profile-likelihood interval for psi (kappa profiled, level .99) at 72 per
      arm: coverage .985-.999 for truths c in {.5, .75, .9}; conservative at c = 1
      (boundary); median width 55-85% of the Fieller interval"
  state_dependence:
    claim_E2a: "power of E2a at 72 per arm, one-sided .005, full coupling, event rule:
      P0 <= .02; P1 and P3 .50-.80; P2 .75-.95; P4 >= .95. Count rule: P1 >= .90."
    claim_E2a_rivals: "E2a rejects in <= .01 of replicates under R3 and HS, and in >= .50
      under SH"
    claim_E2b: "E2b rejects in <= .01 under R3, HS and SH; its power is 10-30 points below
      E2a at P1-P4"
    claim_NP_dependence: "frontier for independence against the model's joint distribution
      (same marginals): n per arm for .90 is 40-70% of what E2a needs"
  aggregate_paths:
    claim_paths: "at each gate point, residual_t(G_HIGH) at t = 20 exceeds the
      representative-agent value by at least .15 at P1-P3, and its limit equals the share
      of agents with legitimacy 0 (within .01)"
