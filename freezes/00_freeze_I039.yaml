# =================================================================== RECONCILIATION
reconciliation_with_I038:
  what_I038_did: "the frozen test of mean sufficiency FAILED (trap probability differs by up
    to .38 between populations with the same mean coupling). I then re-stated the claim as an
    edge location (DISS-SUFF-MEAN-v2) and used it to justify a mean-type estimand (rule R1b)."
  what_is_wrong_with_that: "the failed test was the informative result. An edge location in a
    band is not sufficiency, and the programme's own aggregation result (FLOW C9-T: the
    aggregate slope differs from the mean-group slope under the gate, sign-separated from the
    utility rival) says the aggregate is NOT a function of the mean. R1b is withdrawn."
  consequence: "psi is kept only as what it is: the first moment of the relative gain
    distribution. I039 derives what the model implies beyond the first moment and asks which
    observable carries it."

# =================================================================== PART S: SYMBOLIC MODEL
part_S_symbolic:
  primitives:
    state: "agent i holds belief q, legitimacy l in [0,1], aspiration a in [0,1]"
    evidence: "an evidence event e produces the error delta = e - q"
    gain: "gamma_c(l) = 1 - c (1 - l), coupling c in [0,1]; the paper is c = 1, gamma = l"
  kernel:   # as implemented in the task generator (market_generator.py lines 143-149)
    K1: "q' = q + kappa * gamma_c(l) * delta            (pre-update l)"
    K2: "D = phi_minus * max(a - r, 0) + phi_plus * max(r - a, 0);
         l' = clip01( l - nuF * max(D - tau, 0) + nuR * [D <= tau] )   (pre-update a)"
    K3: "a' = clip01( (1 - rho) a + rho ((1 - chi) r + chi ref) )"
  claims:   # statement; where it is to be certified
    P1_freeze: {statement: "c = 1 and l = 0 imply q' = q for every delta", authority: "Lean (T6)"}
    P2_gain_ratio: {statement: "gamma_c(1) = 1, gamma_c(0) = 1 - c; so c = 1 - gamma_c(0)/gamma_c(1)", authority: "Lean (T7)"}
    P3_reference_monotone:
      statement: "for outcomes r_t in {0,1}, phi_minus = 1, phi_plus <= tau, nuF, nuR >= 0,
        0 <= rho <= 1, 0 <= chi <= 1, equal initial states and equal outcome sequences: if
        ref_t <= ref'_t for all t then a_t <= a'_t and l_t >= l'_t for all t"
      authority: "Lean (T13: one step, then by induction over a list of trials)"
      note: "the condition phi_plus <= tau is new and comes from writing the proof: without
        it a win far above a low aspiration generates dissonance and the order can reverse.
        Frozen values satisfy it (.25 <= .3)."
    P4_aggregation_identity:
      statement: "for any population, mean(dq) = kappa ( mean(gamma) mean(delta) +
        Cov(gamma, delta) ). Two types with weights p, 1-p: the covariance term is
        p (1-p) (gamma_1 - gamma_2)(delta_1 - delta_2)."
      authority: "Lean (T8, two types); the general identity is the definition of covariance"
    P5_dispersion:
      statement: "second evidence step with the same gain w: the aggregate response is
        mean(w (1 - w)) = m (1 - m) - Var(w), m = mean(w). Two types: Var = p (1-p)(w_1 - w_2)^2 >= 0."
      authority: "Lean (T9, T10)"
    P6_horizon:
      statement: "common initial error, constant evidence: the aggregate residual error after
        t events is mean((1 - w)^t) >= (1 - mean(w))^t for every t >= 1 (two types, 0 <= w <= 1)"
      authority: "Lean (T11, two types, every t by induction); general distributions: Jensen (analytic)"
    P6b_not_mean_sufficient:
      statement: "NOT (exists f, for all gain distributions G and all t: residual_t(G) =
        f(mean_G(w), t)). Witness: at t = 2, two populations with the same mean and
        different variance (T9 is strict when p (1-p)(w_1 - w_2)^2 > 0)."
      authority: "Lean (T9 gives the witness inequality); the residual sequence is the moment
        sequence of 1 - w, so it determines G (Hausdorff moment problem; analytic, cited only
        if verified)"
    P7_limit: {statement: "residual_t(G) -> G({w = 0}) as t -> infinity; a representative agent with the mean gain -> 0 whenever the mean is positive", authority: "analytic (dominated convergence)"}
    P8_two_type_identification:
      statement: "two types (share pi with gain 1 - c, share 1 - pi with gain 1): psi = 1 - c pi
        and V = c^2 pi (1 - pi) imply c (1 - psi) = V + (1 - psi)^2 and pi (V + (1 - psi)^2) = (1 - psi)^2"
      authority: "Lean (T12)"
    P9_product_bound: {statement: "0 <= c <= 1, 0 <= lH <= lL <= 1 imply 1 - c (1 - lH) >= (1 - c)(1 - c (1 - lL))  (so psi >= 1 - c under a linear rule)", authority: "Lean (T14)"}
  formal_gate: "independent compile with the official Lean 4.28.0 binary, core only, over Rat;
    #print axioms for every theorem must show exactly [propext, Classical.choice, Quot.sound]
    or a subset; no sorry. Sources go to CSL branch lean-diss-core (never main) with hash
