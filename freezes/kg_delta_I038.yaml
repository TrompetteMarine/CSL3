refuted_preserved:
  - "DISS-SUFF-MEAN as first tested (P_dw equal at equal mean coupling within .10): largest
    difference .38; superseded by DISS-SUFF-MEAN-v2 (edge location)"
  - "DISS-SUFF-SHARE (P_dw depends on the shut share alone): range .53 at a share of .8"
  - "prevalence edge predicted at .45-.75: it is .926"
  - "80% fully shut with 20% open predicted to give P_dw >= .40: .037"
  - "AD-A2 detail (skewed family lowest; edges .92-.95): two-type (0; 1) lowest at .915"
  - "EM1 bands for the outcome rule (.08-.15, .04-.08): observed .053-.113, .029-.062"
  - "rule sensitivity <= .05 at control weight .5: .064-.071 at coupling <= .75"
  - "D3 at the central point (100-300 per arm): unreachable, the model's own value is above
    the threshold; and the update 'out of reach everywhere' is wrong at P0 (200 / 600)"
  - "D2 at coupling .5 within 150 per arm: holds under the outcome rule only"
  - "AD-C2 bands: D2 needs fewer than predicted at coupling 0 and .25 (outcome); the 2:1
    split saves 25% (outcome) or nothing on the grid (event), not 5-15%"
not_run: "DISS-PREV-LB (P-P lower bound on a shut-down share): rule R2 was not selected"

flags_not_patched: "the headline trap needs nearly everyone to have nearly stopped learning
  (mean coupling >= .90-.95); a shut-down majority of 80% is not enough"
integrity: {proof_cycle_check: pass, ids_unique: checked_against_prior_deltas,
            application_bridge: "synthetic only; every human reading open until the pilot"}
persistence: "CSL3 freezes/kg_delta_I038.yaml + Project mirror; no remote KG service"
