  - {from: DISS-ESTIMAND-PSI, to: DISS-PSI-INVARIANT, type: supported_by}
  - {from: DISS-ESTIMAND-PSI, to: DISS-PSI-REGULAR, type: supported_by}
  - {from: DISS-PSI-TRAPSET, to: DISS-ESTIMAND-PSI, type: requires}
  - {from: DISS-PSI-TRAPSET, to: DISS-COUPLE-EDGE, type: requires}
  - {from: DISS-PSI-TRAPSET, to: DISS-DESIGN-BASIS-THEORY-EDGE, type: requires, note: "gate points P0-P4"}
  - {from: DISS-PSI-DECISIONS, to: DISS-PSI-TRAPSET, type: requires}
  - {from: DISS-PSI-DECISIONS, to: DISS-PSI-REGULAR, type: requires}
  - {from: DISS-PSI-DECISIONS, to: DISS-EFFECTIVE-DRAWS, type: requires, note: "inherited from the design"}
  - {from: DISS-PSI-DECISIONS, to: ASYMPTOTIC-N-PSI, type: qualified_by}
  - {from: DISS-LAB-UPTAKE, to: DISS-PSI-ATTRITION, type: qualified_by, note: "control for disengagement that differs by arm"}
  - {from: DISS-SUFF-MEAN-v2, to: DISS-PREV-EDGE, type: qualified_by}
