  - "S5 (the revision rule identified with 54-84 control participants): 120"
  - "S6, one cell (relative s.d. of the computed size 20-35% at 36 pairs): 36%"
  - "S7, four cells (count rule at P4 40-54 pairs; forecast noise 8: 36-54; 20% inattentive: 90-108; a round counting for 80 settlements: 120-300): 60; 60; 120; 336"
  - "S8, PLAT2 on individuals (96-144 per arm under the one-update rule, at most 72 under the count rule): 288 and 144 at P1"
  - "S10, three cells (six per market: at most 4 triplets at P1 with a session effect of .1; P4 without a session effect 6-7 and, count rule, 4-5): 5; 8; 6"
