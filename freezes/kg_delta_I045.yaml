  - "memo draft: 'fairness 1.00 from 36 pairs' (.99); 'a basket multiplies the requirement by more than three' (2.9-3.3); a ladder total of 1,300-1,800 without its sum (1,128 and 1,584); the rival test costed with two record pairs without the as-built figure (960 and 480 people); 'two draws gave the same answer' (a third gave one grid step less)"
flags_not_patched: "none for the manuscript. For the experiment: every requirement is at the model's
  own effect (DISS-POWER-SCOPE); ratings are plain (linear, gain .5) and the rating shapes of I041,
  under which the entitlement test is much weaker, were not rerun; human parameters were varied one
  at a time; the classifier was
  scored inside the model's family of trajectories and at P1 and P4 only; the rival tests were sized
  over P1-P3; shares in the individual design, a basket as a milestone with trading on, session
  effects in the individual design, stand-ins and dropouts were not simulated; the cash link and
  ownership were not simulated because the model predicts no change."
