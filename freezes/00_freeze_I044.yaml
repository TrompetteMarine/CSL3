design_W:   # the live economy; a proposal for certification, every operational detail author-gated
  script: "drawn before the session and logged: supply of each good at each clearing, every trader's private
    value at each clearing, tie-breaks, signals, settlement draws, interventions. The engine is a
    deterministic function of script and orders; any market can be replayed under other orders."
  session: "two markets of N traders (focal and neighbour), no trade between them. Treatment by session.
    Twin sessions: one HIGH, one LOW, same focal script, different people."
  stage_A: "six rounds (one rich, five scarce in the focal market), 120 clearings per round. One standing
    basket order per round; in the certification the order is the good bid for (the certified binary choice).
    At each clearing a Walrasian auctioneer clears each good: every trader bidding for the good demands one
    unit at their value, the scripted units go to the highest bids, the price is the highest losing bid (the
    lowest market-clearing price) or the reserve when supply exceeds bidders. A filled unit earns value
    minus price. The reference a trader sees is the other market's fills."
  stage_B: "claims on TRIANGLE only. Private forecast, private evidence (ten trial closes), private forecast;
    then the claim trades against an automated market maker with the cash earned in stage A; settlement at
    the end. Variant under study: twelve successive records on one claim with a forecast after each."
  left_to_the_author: "group size; baskets as recipes over the two goods and the completion payment; whether
    the trader sets a bid or the engine bids the value; what is shown of the own market; the market maker's
    liquidity; the conversion of cash to money"

simulation:   # frozen settings; script experiment/analysis/market_cert_I044.py; seed 140000
  pools: "2,400 simulated sessions per arm, gate point and configuration; 2,000 samples per cell"
  kernel: "the gate kernel of twins_I040.twins unchanged (beta 12, alpha .2, phi_minus 1, phi_plus .25,
    tolerance .3, nu .05, rigidity .002 | .02 half each, L0 1, A0 .5; gate points P0-P4); the outcome of a
    clearing is the filled share of the unit (1 or 0 under unit orders)"
  supply: "units of a good per clearing ~ Binomial(N, pi); (plentiful, other) = (.55, .22) when rich and
    (.15, .05) when scarce; round 1 rich in both markets; rounds 2-6 focal scarce, neighbour rich (HIGH) or
    scarce on its own script (LOW)"
  values: "private value of a unit i.i.d. uniform on (0, 1) per trader and clearing; reserve 0; bids = values
    (dominant under the highest-losing-bid price). Variant: persistent shading, bid = value x (1 - m_i),
    m_i ~ U(0, .5)"
  reference: "the other market's mean fill over its last 15 clearings. Variant: cumulative since the start"
  institution_variant: "divisible clearing: every bidder for a good receives the same share min(1, units /
    bidders)"
  shared_by_twins: "the focal script (supply and values). Not shared: people (rigidity, choice noise, rating
    and forecast noise)"
  measures: "ratings and probes as in I041 (three-item fairness: gain .5, noise 5.8; two record pairs; weight
    pg.weight(g, 10, rule); 10% inattentive; forecast noise 12); session effects added as a normal shift per
    market with intraclass correlation 0, .1 or .2 relative to the within-market variance"
  tests_at_market_level: "one-sided .005. H1a_M: paired t on the twin difference of market-mean last fairness.
    D1_M: upper Fieller limit of mean(T_HIGH)/mean(T_LOW) below 1, from market means, t quantile with
    2S - 2 df. EFF: paired t on the share of scripted units sold. PLAT: delta = [1 - (1 - E)^(11/4)] - L > 0
    in the HIGH arm, E and L the closures (share of the gap between evidence closed) averaged over records
    3-5 and 10-12, delta method on market means, t quantile with S - 1 df. PRICE: upper Fieller limit of the
    ratio of market price responses below 1."
  market_maker: "logarithmic scoring rule, liquidity 60; bankroll = 5 x surplus earned; a trader stakes at
    most a quarter of the bankroll per claim and moves the price toward their belief; one pass in random
    order"

