iteration_id: "KGi-DISS-I037"
mode: "simulation and Monte Carlo certification on synthetic cohorts; no human data; no
  recruitment, OSF filing or ethics claim; manuscript not edited. This file is written
  before any I037 run (engine mode couple, probe design, certification, fairness score)."
freeze_time: "2026-11-11T11:25Z"
freeze_relative_to_work: "done before freezing: engine fields c_own / c_soc added (defaults
  reproduce the frozen engine: validation gate and the I036 census re-run bit-identical);
  probe_generator.py written and its 7 invariants pass. Nothing else run."
baseline:
  repo: "CSL3 main 175d317 (I036 close) + this freeze"
  kg: "freezes/kg_delta_I032.yaml, freezes/kg_delta_I033_I034.yaml (incl. i035, i036 blocks)"
  tests: "46 passing at rehydration"
author_directive: "2026-11-11: full power on the next iteration (I037), update the KG, use KGi"
objective: "Turn the minimal mechanism of I036 (after reference-dependent delegitimation
  people revise beliefs less on evidence) into a certified lab design: (A) how weak may
  the discounting be before the paper's trap disappears; (B) the cheapest probe that
  detects discounting at that edge and is safe against the rivals; (C) what the fairness
  measure still has to do; (D) KG update."

defect_found_before_running:
  id: BATCHED-ACCURACY-SCREEN
  statement: "In the round-summary task the preregistered rich-phase accuracy screen
    (accuracy >= chance + 2 s.e.) is ill-defined: with one ticket choice per round and two
    rich rounds, accuracy is 0, .5 or 1, and the first choice is a coin flip, so the screen
    removes about half of the simulated participants (those whose first pick was the worse
    ticket). I033 AD-B1, AD-O1 and I034 applied it, so their per-cell sample sizes are
    post-exclusion numbers for a selected half."
  action: "I037 drops the accuracy screen in the round task (zero-variance screen kept;
    attention checks take its place in the probe). Part C recomputes the fairness scores
    without it and states the old exclusion share. Earlier records are not rewritten."

# =================================================================== PART A
part_A_coupling_edge:
  claim_id: DISS-COUPLE-EDGE
  definition: "learning multiplier = 1 - c (1 - L) on each channel (own outcomes: c_own;
    others' outcomes: c_soc); c = 1 is the paper, c = 0 no discounting"
  run: "engine mode couple at the paper cell (A0 .8, lambda .7, rho .002, Gamma .1, n 200,
    T 600), 400 runs per cell, seeds 64000 + 1000*cell: 6 x 6 grid over {0, .25, .5, .75,
    .9, 1}; diagonal; social edge (c_own = 1); own edge (c_soc = 1); diagonal at speeds
    .895 and 1.25"
  edge_rule: "edge = linear interpolation of the first crossing of P_dw = .5 along a line
    (diag, soc, own); 'none' if P_dw stays >= .5 down to the smallest value run"
  expected:
    EA1: "diagonal edge in [.80, .95]"
    EA2: "social edge (own fully coupled) in [.75, .92]"
    EA3: "own edge (social fully coupled) <= .7: the trap survives a half-open own channel,
      because own outcomes say nothing about the unchosen option"
    EA4: "P_dw < .05 whenever c_soc <= .5"
  channel_rule: "the lab probe targets the channel with the higher edge; if the two edges
    differ by less than .15 (or the own edge is 'none' and the social edge is 'none'), both
    channels are probed and the diagonal edge is used. c_edge := edge of the probed
    channel."

# =================================================================== PART B
part_B_probe:
  claim_id: DISS-LAB-UPTAKE (v2)
  simulator: "experiment/analysis/probe_generator.py (assumptions listed in its header:
    multiplier g = 1 - c(1 - M); per-outcome weight 1 - (1 - .2 g)^m or per-event weight
    .5 g; prior N(50, 10); reports rounded to 5 with noise sigma_f; 10% inattentive)"
  theory_points: "P0-P4 of freeze I033 T2 with c = 1, plus P6 coupling edge (s 1, ratio .25,
    chi .4, c = c_edge). Legitimacy at probe time from design_generator (12k per arm, c = 1
    in the task dynamics; approximation noted)."
  stage_1_screen:
    script: "experiment/analysis/probe_design_I037.py (seed 134200)"
    designs: "(rich rounds, deprivation rounds, draws per round, deprivation odds):
      (2,5,25,std) (2,5,40,std) (2,4,40,std) (1,5,40,std) (1,6,40,std) (2,5,40,harsh)
      (2,4,40,harsh) (1,5,40,harsh); std = .30/.15, harsh = .25/.10"
    probe_options: "m in {5, 7, 10}; scheme in {single, pair, pair2, did}; sigma_f in {8, 12,
      16}; integration in {outcome, event}"
    statistic: "theta = P(T_LOW > T_HIGH) from 12k per arm; n per arm = 2.48/(theta - .5)^2
      (one-sided WMW .005, power .90); worst theory point"
    repetitions: "rounds + probe tickets (single 1, pair 2, pair2 4, did 4); budget <= 10"
    selection_rule: "S1 = among {single, pair, pair2} within budget, the row minimising
      max over the two integration rules of n at sigma_f = 12; S2 = the same among {did}.
      Ties -> fewer repetitions."
  stage_2_certification:
    script: "experiment/analysis/probe_cert_I037.py (seed 134300)"
    n: "ceil of the selection-rule n for S1 and for S2"
    monte_carlo: "B = 1000 replicates of n per arm drawn from fresh 20k pools; actual
      one-sided WMW at .005"
    power: "every theory point x integration x sigma_f in {8, 12, 16}"
    false_positives: "R3 (chi .4, .6), R4, R1, no-gate composite (R3 share .5595 + R4), and
      a disengagement rival (R3 population with an extra 10% / 20% of HIGH participants not
      revising at all), at sigma_f = 12, both integrations"
    attention_check_variant: "exclude participants failing an attention check on the
      evidence (inattentive fail with prob .8, attentive with prob .05): power and
      disengagement false positives for S1"
    lab_to_abm: "expected HIGH/LOW ratio of mean revision weights per theory point for S1
      (the number a pilot can be compared with)"
  expected:
    EB1: "a pair needs fewer participants than a single ticket"
    EB2: "S1 n <= 150 per arm at sigma_f 12 (uncertain; the coupling edge may bind)"
    EB3: "per-event integration needs fewer participants than per-outcome"
    EB4: "Monte Carlo power at the selected n is within .03 of .90 at the binding point"
    EB5: "false positives <= .01 vs R3, R4 and the composite; 0 vs R1"
    EB6: "disengagement (20%): raw S1 false positives >= .5; S2 (did) <= .02; the
      attention-check variant in between"

# =================================================================== PART C
part_C_fairness:
  script: "experiment/analysis/fairness_score_I037.py (training seed 134400, test 134401)"
  what: "reference-effect score S-a (weights Sigma^-1 d, WMW between arms) on the fairness
    ratings of (i) the ten-round design 2/5/3 at k 25 and (ii) the S1 design's rounds before
    the probe, both WITHOUT the accuracy screen; gains .25, .5, 1; three-item scale; M2;
    share excluded by the old screen reported; S-b (R3-orthogonal) for (i) as an erratum
    row"
  expected:
    EC1: "without the screen S-a needs more participants than AD-O1 reported (70 at gain
      .5); by how much is unknown"
    EC2: "in the S1 design the probe, not S-a, sets the sample at gain >= .5"

# =================================================================== PART D
part_D_kg: "freezes/kg_delta_I037.yaml (scoped delta) and freezes/kg_active_I037.yaml (the
  active claim ledger for the experiment: accepted-synthetic / open / refuted), mirrored
  to the Project. No remote KG service exists; persistence = repo + Project."

completion: "A, B, C run once under this freeze; scorecard verbatim including failures;
  all seeded records re-run for bit-identity; KG delta validated (ids, references)."

# =================================================================== PART A RESULT (verbatim) + ADDENDUM AD-A2 (pre-run)
part_A_result:
  record: "records/couple.csv (400 runs per cell)"
  edges: "diagonal .945 (P_dw .03 at .90, .56 at .95); social edge with own fully coupled
    .893 (.12 at .85, .56 at .90); own edge with social fully coupled .881 (.04 at .80, .61
    at .90). At the speed edge (s .895) the trap needs c = 1 (.49) and is 0 at c = .9; at
    s 1.25 it is 1.00 at c = 1 and .06 at c = .9."
  EA1: "PASS (.945, at the top of the predicted range)"
  EA2: "PASS (.893)"
  EA3: "FAIL. Own edge .881, not <= .7: a 20%-open own channel already dissolves the trap
    (P_dw .04 at c_own .8). My account of the own channel was wrong a second time."
  EA4: "PASS (0 everywhere with c_soc <= .75)"
  channel_rule_outcome: "edges differ by .012 < .15 -> probe BOTH channels; c_edge = .945"
  consequence: "the trap at the paper cell needs near-total shutdown of learning on both
    channels (>= ~90%); with partial discounting the population corrects within the
    horizon. P_dw at T = 600 is therefore a knife-edge in the coupling too."
AD_A2_correction_time:   # written after part A's result, before running
  question: "is the consequence of PARTIAL discounting graded? How long does the wrong
    consensus last as a function of coupling strength?"
  run: "engine mode ctime: paper cell, T = 2400, diagonal c in {0, .25, .5, .75, .85, .9,
    .95, 1}, 200 runs each, seeds 65000 + 1000*cell; correction time = first trial from
    which community 2's share on the better option stays above .7 for 20 trials"
  expected: "median correction time roughly flat up to c = .75, then rising steeply; at
    c = 1 about 1200-1400 (the gate reopens as entitlement decays); uncertain"
  use: "a graded lab-to-ABM map: measured discounting -> predicted lengthening of the
    wrong consensus (reported alongside P_dw, not instead of it)"

# =================================================================== PART B STAGE 1 RESULT (verbatim) + ADDENDUM AD-B2 (pre-run)
part_B_stage1_result:
  record: "records/probe_design_I037.{txt,csv}, records/probe_design_I037_selected.json"
  S1: "2 rich + 4 deprivation rounds, 40 draws per round, harsh deprivation odds; two pairs
    (4 probe tickets), m = 7; 10 repetitions; n per arm 213 (per-outcome) / 274 (per-event)
    -> 274; binding point P4 (anchoring edge), not the coupling edge"
  S2: "same task, one market pair + one control pair (did), m = 5: 845 per arm"
  EB1: "PASS: pair 298 vs single 468 per arm (sigma 12, per-outcome, S1 task)"
  EB2: "FAIL: S1 needs 274 per arm, not <= 150"
  EB3: "FAIL: per-event integration needs MORE (274 vs 213), not fewer"
  note: "forecast noise matters a lot: pair2 180-187 at sigma 8, 310-406 at sigma 16"
AD_B2_extended_exposure:   # written after stage 1, before running
  reason: "the legitimacy gap at probe time is only about .36-.43 (HIGH) against .62-.65
    (LOW) at the edge points; the levers that cost the participant nothing were not in the
    frozen grid: more draws inside each round summary, a richer rich phase with a higher
    board, and the deprivation odds"
  grid: "rounds (2,4) and (1,5); draws per round k in {40, 60, 80, 120}; deprivation odds
    std / harsh; rich phase + board: p65 = (.65/.35, board .65) or p75 = (.75/.35, board
    .72); probe pair2 with m in {7, 10}; sigma_f 12; both integration rules; theory points
    recomputed per design (P4's anchoring weight uses the design's board level)"
  script: "experiment/analysis/probe_design2_I037.py (seed 134250)"
  selection: "S1x = row minimising max over integration rules of n; certified in stage 2 in
    place of S1 if its n is lower (S1 kept in the record)"
  expected: "an interior optimum in k (HIGH legitimacy hits the floor, LOW starts to fall);
    n for S1x between 120 and 220 per arm; the richer rich phase helps (uncertain)"
  dependence_flag: "every gain from larger k rests on per-outcome integration of round
    summaries (count lemma). If people update once per round, k is irrelevant. This is a
    human quantity (pilot: vary k between participants)."

# =================================================================== AD-B2 RESULT (verbatim) + ADDENDUM AD-B3 (pre-run, certification scope)
AD_B2_result:
  record: "records/probe_design2_I037.{txt,csv}"
  S1x: "1 rich + 5 deprivation rounds, 120 draws per round, harsh deprivation odds, rich
    phase .75/.35 with board .72; two pairs, m = 10; 10 repetitions; n per arm 48
    (per-outcome) / 72 (per-event) -> 72. The standard rich phase (.65/.35, board .65) gives
    47 / 73: indistinguishable."
  expectation: "FAIL on shape and range: no interior optimum in k within the grid, and n is
    72, below the predicted 120-220. The gain is a threshold in exposure: with 600
    deprivation draws LOW participants' entitlement has adapted and their legitimacy
    recovers (.87) while HIGH stays collapsed (.11-.41); at 240-480 draws LOW is still
    falling (.53-.67). Non-monotone in k between (40 -> 80 can be worse)."
  binding_point: "P4 (anchoring edge) in every row"
  dependence_flag_restated: "the 600-draw exposure only counts if people integrate a round
    summary per outcome, for entitlement as well as legitimacy. If not, S1 (274 per arm at
    40 draws) is the relevant number, or worse."
AD_B3_certification_scope:   # fixed before the certification runs
  certify: "S1x (in place of S1, lower n) and S2 as frozen"
  added_for_S1x:
    partial_discounting: "at theory point P1's gate parameters, coupling c in {0, .25, .5,
      .75, .85, .9, .945, 1}: expected HIGH/LOW revision-weight ratio and Monte Carlo power
      at the certified n, tabulated against P_dw(c) (records/couple.csv, diagonal) and the
      median correction time (records/ctime.csv)"
    starting_entitlement: "power at the certified n with starting entitlement .4 and .6
      (frozen value .5), sigma_f 12, both integrations"
  expected: "power >= .9 for c >= .9; about .5 at c = .5; ~alpha at c = 0. Starting
    entitlement .4 lowers power materially (as in I033 stage 2)."

