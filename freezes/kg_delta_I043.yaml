new_nodes:
  - id: DISS-DESIGN-B
    kind: design
    status: certified-synthetic for what it changes; built; not run on people; author-gated
    statement: "design Y in the storyboard's institutions. Rounds 1-6: order one of two goods;
      the goods market clears 120 times; the order fills when the clearing price is at or
      below the cap; a trader board shows filled orders; one point per good, six goods a
      basket (a count, no quota). Rounds 7-10: four prediction markets common to a file;
      forecast, evidence (ten trial closes with own tickets, or a source's forecast), forecast
      again, then a bet at a posted price; settlement at the end. Left out on purpose:
      informative prices beyond the ordered good's own path, the other good's prices, a
      two-stage route task, live order matching, mixed baskets, a stated quota."
    evidence: "freezes/00_freeze_I043.yaml; experiment/YOKED_DESIGN.md; records/112_basket_market_I043.md"
  - id: DISS-PRICE-DISPLAY
    kind: definition
    status: tested
    statement: "price = cap * exp(sigma * (z(u) - z(p))), u the schedule's settlement draw, p
      the ordered good's fill chance: a price is at or below the cap exactly when the
      schedule's bit is 1 (120 schedules, six rounds, both goods). The price adds the size of
      a miss to what design Y showed; it is the same for both members of a pair."
    evidence: "experiment/diss_market/engine.py (price_path); test_market_engine_I043.py"
  - id: DISS-SOURCE-WEIGHT
    kind: assumption
    status: open (pilot)
    statement: "the weight on a source's forecast is kappa_s * g, g the gate; kappa_s is
      unknown (.2, .35, .5 examined). Advice discounting is documented (Yaniv & Kleinberger
      2000, abstract level); no value is taken from the literature."
  - id: DISS-CERT-B
    kind: numerical
    status: certified-synthetic
    statement: "72 pairs, one-sided .005. D1 and the confirmatory pair: 1.000 at P0-P3 for
      every kappa_s; at P4, one-update rule, .947 / .893 / .790 for kappa_s .5 / .35 / .2
      (count rule .990 / .990 / .966); 96 pairs give .973 / .913 at .35 / .2. FREEZE at P1-P3,
      one-update rule: .90-.93 / .77-.84 / .59-.60. ASSOC_H at P1-P3: .23 / .32 / .24 at
      kappa_s .35. Sizes D1 .004-.007."
    evidence: "records/basket_cert_I043.txt (seed 139000); scorecard in freezes/00_freeze_I043.yaml"
  - id: DISS-TEST-BET
    kind: statistical
    status: certified-synthetic under an ASSUMED betting rule
    statement: "B = mean over the two market pairs of (bet on the favourable market - bet on
      the unfavourable one) / 2, YES 1, pass 0, NO -1; decision: signed rank within pairs of
      B_LOW - B_HIGH. Power 1.000 at P0-P3 and .994 / .973 / .916 at P4 (kappa_s .5 / .35 /
      .2, one-update rule); size .002-.006. Rule assumed: YES if belief + N(0, 8) exceeds the
      price by 5, NO if 5 below, else pass."
    evidence: "records/basket_cert_I043.txt; experiment/analysis/yoked_from_export.py"
  - id: DISS-SOURCE-POOL
    kind: implementation
    status: verified with bots
    statement: "a source shown in a pilot is a real forecast of the same market (same uid),
      given after ten trial closes in a seed wave on a record-only schedule, inside 80-100
      (favourable) or 0-20 (unfavourable), from a forecaster with the best record on the other
      three markets, as near 90 / 10 as the pool allows; the same for both members of a pair.
      A session does not start without a usable forecast for every market."
    defect_fixed: "the track record first counted all four markets; next to the forecast it
      told how the market on screen settles (seen on a still, not by a test)"
    evidence: "experiment/tools/make_board_pool.py; test_market_app_I043.py"
  - id: DISS-PALETTE
    kind: implementation
    status: validated pair by pair
    statement: "goods carry colour (Square #2a78d6, Triangle #eb6834; apart by more than 24
      under every vision type); people are neutral (board trader slate #3f4756, at least 21
      from either good; a source in ink); YES #1f9d55 against NO #c93a9a on bet buttons and
      settled markets only, always with the word (10.3 for red-green colour blindness; 9.3
      for the button inks)."
    defect_fixed: "the palette named in the freeze was validated on neighbours in a list only:
      the trader's violet was 3.8 from Square's blue for red-green colour blindness (11.4 with
      full vision); YES green against NO pink was 5.1 (2.1 for the selected buttons)"
    evidence: "experiment/frontend/src/styles/app.css; records/112_basket_market_I043.md"

