frozen_run_designs:
  pt3b_group_contingent_rival: "network permeability sweep adds Gate::RigUs — Bayesian
    whose rigged hypothesis is GROUP-CONTINGENT ('rigged against us'): own outcomes have
    likelihood Bern(mu_rig) under H_rig; OTHERS' observed outcomes are uninformative
    about H_rig (LR contribution exactly 0, since the hypothesis asserts nothing about
    their payoffs). Same grid/seeds structure as pt3 (26 Gamma values x 60 runs, seeds
    34000-base +154 offset for the new gate); outputs appended to pt3 schema with
    agent='rigus'. PREDICTION RISK STATED NOW (R2): others' success no longer defeats
    the hypothesis; expected outcome is trust collapse AND learning freeze at all Gamma.
    Whatever comes out is reported"
  pred_rival_us: "prediction generator adds agent 'rival_us' with the same group-
    contingent likelihood (peer LR = 0); conditions {HIGH,LOW} x FULL + HIGH x MODERATE,
    n=300, seeds 71000+; panel c of the predictions figure becomes the two-rival panel;
    the discriminator claim is RESCOPED to what the data show (expected: sign reversal
    holds only for the global-rig class; restoration dynamics + increment asymmetry
    carry the discrimination against the group-contingent class)"
  nonlex_variant: "Gate::DissNL — the non-lexicographic L-update adds a surprise-erosion
    term -nuS*delta^2/2 with nuS = nuF = .05 (unit-w_f convention, stated); run the
    confirmatory cell contrast (300 fresh-seed runs, seeds 45000) + the A0=.5 baseline;
    gate: report P_dw and restore under the variant; claim limited to 'threshold
    structure survives with shifted constants' as SI Remark already states"
  finite_size_scaling: "mode fss: lambda=.75 cut, 15 A0 points in [.58,.72], 60 runs per
    cell, N in {50,100,200,400,800,1600} (T=600, seeds 46000 + iN*10000 + cell*100);
    outputs m2 mean/var per cell; derived: front width (A0 range where P_dw in
    [.1,.9]) and variance-peak height vs N"
  horizon_sweep: "mode tsweep: chi=.432 column of pt2 (26 rho values, 40 runs), T in
    {600, 2400, 9600} (seeds 47000 + iT*10000 + cell*1000); derived: empirical rho
    boundary (P_persist=.5 crossing) vs T and its gap to rho_c=0.00641"
  threshold_sensitivity: "mode sens: pt1 grid re-classified under thresholds
    (.25,.25), (.30,.30), (.35,.35) on the SAME seeds; derived: shift of the lambda=.75
    front location"
  mf_vs_abm: "deterministic mean-field map (Lemmas S5.1-S5.3) integrated at the
    confirmatory cell and the rescued cell; overlaid on ABM community means (race.csv
    runs + 20-run bands, seeds 38100+); quantifies Lemma S5.1's residual"
  design_power: "from pred_series subject-level draws: simulated effect sizes and power
    at the preregistered N=320/group, alpha=.005 for H1 (Welch d), H2 (lag), H3 (slope
    interaction), H4 (shortfall coefficient); model-based power, labelled as such"
