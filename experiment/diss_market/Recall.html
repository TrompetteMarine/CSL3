{{ block styles }}{{ include_sibling '_head.html' }}{{ endblock }}
{{ block content }}
<div class="dm">
  {{ include_sibling '_top.html' }}
  <main class="dm-main dm-narrow dm-recall">
    {{ include_sibling '_errors.html' }}
    <h1 class="dm-h1 is-small">{{ question }}</h1>
    <div class="dm-chips {{ if wide }}is-wide{{ endif }}" role="radiogroup" aria-label="{{ question }}">
      {{ for o in options }}
      <label class="dm-chip"><input type="radio" name="recall" value="{{ o.v }}"><span>{{ o.label }}</span></label>
      {{ endfor }}
    </div>
    <div class="dm-actions"><button class="dm-btn" id="dm-next" type="submit" disabled>{{ t.recall_next }}</button></div>
  </main>
</div>
{{ endblock }}
{{ block scripts }}{{ include_sibling '_foot.html' }}{{ endblock }}
